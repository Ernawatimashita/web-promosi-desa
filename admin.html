<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Desa Pusaka</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d5437;
            --primary-light: #2d8a5f;
            --bg-light: #f4f8f5;
            --surface: #ffffff;
            --text-main: #142e23;
            --border-color: #edf2ef;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* CARD LOGIN */
        .login-card {
            max-width: 400px;
            margin: 80px auto;
            background: var(--surface);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: var(--primary-light);
        }

        /* DASHBOARD ADMIN */
        .dashboard {
            display: none;
        }

        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-refresh {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* TABEL DATA */
        .table-responsive {
            overflow-x: auto;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background: var(--primary);
            color: white;
        }

        tr:hover {
            background: #f9fbf9;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN BOX -->
    <div id="loginBox" class="login-card">
        <h2>🔒 Login Admin Desa</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username Admin</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-login">Masuk ke Dashboard</button>
        </form>
    </div>

    <!-- DASHBOARD RESULTS -->
    <div id="adminDashboard" class="dashboard">
        <div class="header-admin">
            <h2>📬 Pesan Masuk Desa Pusaka</h2>
            <div class="action-btns">
                <button id="refreshBtn" class="btn-refresh" onclick="muatDataPesan()">🔄 Muat Ulang Data</button>
                <button id="logoutBtn" class="btn-logout">Keluar (Logout)</button>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Lengkap</th>
                        <th>Nomor WA</th>
                        <th>Dusun / RT</th>
                        <th>Keperluan / Pesan</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" style="text-align: center;">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // =========================================================
    // KREDENSIAL AKUN ADMIN (Ubah sesuai kebutuhan)
    // =========================================================
    const DEFAULT_USER = "admin";
    const DEFAULT_PASS = "PusakaDesa2026!"; // <-- Password login admin di sini

    // URL Database SheetDB
    const SHEETDB_URL = "https://sheetdb.io/api/v1/wdiapwaud3dcz";

    const loginBox = document.getElementById("loginBox");
    const adminDashboard = document.getElementById("adminDashboard");
    const loginForm = document.getElementById("loginForm");
    const logoutBtn = document.getElementById("logoutBtn");
    const tableBody = document.getElementById("tableBody");

    // Cek Status Login dari Sesi Browser
    if (sessionStorage.getItem("isAdminLoggedIn") === "true") {
        tampilkanDashboard();
    }

    // Aksi Submit Form Login
    loginForm.addEventListener("submit", function(e) {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value.trim();

        if (user === DEFAULT_USER && pass === DEFAULT_PASS) {
            sessionStorage.setItem("isAdminLoggedIn", "true");
            tampilkanDashboard();
        } else {
            alert("❌ Akses Ditolak: Username atau Password Admin salah!");
        }
    });

    // Logout Admin
    logoutBtn.addEventListener("click", function() {
        sessionStorage.removeItem("isAdminLoggedIn");
        location.reload();
    });

    // Menampilkan Halaman Dashboard
    function tampilkanDashboard() {
        loginBox.style.display = "none";
        adminDashboard.style.display = "block";
        muatDataPesan();
    }

    // Mengambil Data Pesan dari API
    async function muatDataPesan() {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Memuat data terbaru...</td></tr>`;
        
        try {
            const response = await fetch(SHEETDB_URL);
            const data = await response.json();

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Belum ada pesan masuk.</td></tr>`;
                return;
            }

            let htmlContent = "";
            data.forEach((row, index) => {
                const nama = row["Nama Lengkap"] || "-";
                const wa = row["Nomor WA"] || row["Nomor Wa"] || "-";
                const dusun = row["Dusun/RT"] || row["Dusun/Rt"] || "-";
                const pesan = row["Keperluan/Pesan"] || "-";

                htmlContent += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><b>${nama}</b></td>
                        <td>
                            <a href="https://wa.me/${wa.replace(/[^0-9]/g, '')}" target="_blank" style="color: #0d5437; font-weight: 700; text-decoration: none;">
                                ${wa} 💬
                            </a>
                        </td>
                        <td>${dusun}</td>
                        <td>${pesan}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlContent;

        } catch (error) {
            console.error("Gagal mengambil data:", error);
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Gagal memuat data dari database. Periksa koneksi internet Anda.</td></tr>`;
        }
    }
</script>

</body>
</html>
