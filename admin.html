<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desa Pusaka | Halaman Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0d5437;
            --primary-dark: #062f20;
            --primary-light: #2d8a5f;
            --accent: #e5c158;
            --bg-light: #f4f8f5;
            --surface: #ffffff;
            --text-main: #142e23;
            --text-muted: #5a6e65;
            --border-color: #edf2ef;
            --header-bg: rgba(255, 255, 255, 0.88);
            --radius-lg: 24px;
            --shadow-soft: 0 20px 40px rgba(13, 84, 55, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode {
            --primary: #2d8a5f;
            --primary-dark: #0a1410;
            --bg-light: #0f1713;
            --surface: #1a2821;
            --text-main: #e4ebe7;
            --text-muted: #a0b3aa;
            --border-color: #273b31;
            --header-bg: rgba(26, 40, 33, 0.88);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            z-index: 1000;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(13, 84, 55, 0.1);
        }

        .navbar {
            width: min(1280px, calc(100% - 40px));
            height: 100%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-family: "Playfair Display", serif;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo-text small {
            display: block;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .btn-back {
            background: var(--surface);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            transition: var(--transition);
        }

        .btn-back:hover {
            background: var(--primary);
            color: white;
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            padding-top: 140px;
            padding-bottom: 80px;
        }

        .container {
            width: min(1200px, calc(100% - 40px));
            margin: auto;
        }

        .admin-card {
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .admin-card h1 {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .admin-card p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-box h3 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-box span {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* FOOTER */
        footer {
            background: #031c13;
            color: #8ba398;
            padding: 40px 20px;
            text-align: center;
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

<header>
    <div class="navbar">
        <a href="index.html" class="logo">
            <div class="logo-icon">🌿</div>
            <div class="logo-text">
                Desa Pusaka
                <small>Panel Admin</small>
            </div>
        </a>
        <a href="index.html" class="btn-back">← Kembali ke Beranda</a>
    </div>
</header>

<main>
    <div class="container">
        <div class="admin-card">
            <h1>🔐 Area Pengelolaan Admin</h1>
            <p>Selamat datang di panel kontrol terpadu Pemerintahan Desa Pusaka.</p>
            
            <div class="admin-stats">
                <div class="stat-box">
                    <h3>12</h3>
                    <span>Pesan Masuk</span>
                </div>
                <div class="stat-box">
                    <h3>5</h3>
                    <span>Layanan Surat</span>
                </div>
            </div>

            <p style="font-size: 13px; color: var(--text-muted);">Sistem terhubung dengan Google Apps Script dan Google Sheets.</p>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 Pemerintah Desa Pusaka. All Rights Reserved.</p>
</footer>

</body>
</html>
