<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Desa Pusaka | Kecamatan Tebas</title>

    <meta name="description"
          content="Website resmi Desa Pusaka, Kecamatan Tebas, Kabupaten Sambas, Kalimantan Barat. Mengenal sejarah, potensi, kegiatan dan kehidupan masyarakat Desa Pusaka.">

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px;
        }

        body {
            font-family: "DM Sans", Arial, sans-serif;
            background: #f5f8f5;
            color: #173d2c;
            line-height: 1.7;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        :root {
            --green: #0c422b;
            --green-dark: #062f20;
            --green-light: #dcece2;
            --green-soft: #edf5ef;
            --green-bright: #3b8b61;

            --cream: #f5f8f5;
            --white: #ffffff;

            --text: #173d2c;
            --muted: #68766f;

            --gold: #d8c16a;

            --shadow: 0 25px 70px rgba(19, 59, 40, 0.10);
        }


        /* =====================================================
           SCROLLBAR
        ====================================================== */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #edf3ee;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 20px;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 84px;

            z-index: 9999;

            background: rgba(255, 255, 255, 0.88);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid rgba(12, 66, 43, 0.07);

            transition: all 0.3s ease;
        }

        header.scrolled {
            height: 72px;

            background: rgba(255, 255, 255, 0.97);

            box-shadow:
                0 8px 35px rgba(20, 60, 40, 0.08);
        }

        .navbar {
            width: min(1180px, calc(100% - 40px));

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* =====================================================
           LOGO
        ====================================================== */

        .logo {
            display: flex;

            align-items: center;

            gap: 12px;

            color: var(--green);

            flex-shrink: 0;
        }

        .logo-icon {
            width: 49px;
            height: 49px;

            border-radius: 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 25px;

            background:
                linear-gradient(
                    145deg,
                    #0d5437,
                    #082f20
                );

            box-shadow:
                0 10px 25px rgba(8, 55, 36, 0.18);
        }

        .logo-text {
            font-family: "Playfair Display", serif;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -0.6px;
        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        nav {
            display: flex;

            align-items: center;

            gap: 25px;
        }

        nav a {
            position: relative;

            color: #294b3a;

            font-size: 14px;

            font-weight: 600;

            padding: 8px 0;

            transition: 0.3s;
        }

        nav a::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 2px;

            background: var(--green-bright);

            border-radius: 10px;

            transition: 0.3s;
        }

        nav a:hover {
            color: var(--green-bright);
        }

        nav a:hover::after {
            width: 100%;
        }


        /* =====================================================
           MOBILE BUTTON
        ====================================================== */

        .menu-btn {
            width: 48px;
            height: 48px;

            border: none;

            border-radius: 14px;

            background: var(--green);

            display: none;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(12, 66, 43, 0.18);
        }

        .menu-lines {
            width: 23px;
        }

        .menu-lines span {
            display: block;

            width: 100%;
            height: 2.5px;

            background: white;

            margin: 5px 0;

            border-radius: 20px;

            transition: 0.3s;
        }


        /* =====================================================
           MOBILE MENU
        ====================================================== */

        .mobile-menu {
            position: fixed;

            top: 84px;
            left: 0;

            width: 100%;

            padding: 12px 20px 18px;

            background: rgba(255, 255, 255, 0.98);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            display: none;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);

            z-index: 9998;
        }

        .mobile-menu.active {
            display: block;

            animation:
                menuDown 0.3s ease;
        }

        @keyframes menuDown {

            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .mobile-menu a {
            display: block;

            padding: 13px 10px;

            color: var(--green);

            font-weight: 700;

            border-bottom: 1px solid #e8eee9;
        }

        .mobile-menu a:last-child {
            border-bottom: none;
        }


        /* =====================================================
           HERO / BERANDA
        ====================================================== */

        .hero {
            min-height: 100vh;

            position: relative;

            display: flex;

            align-items: center;

            padding:
                150px 25px
                130px;

            color: white;

            background-image:

                linear-gradient(
                    110deg,
                    rgba(4, 39, 25, 0.78) 0%,
                    rgba(6, 53, 34, 0.54) 45%,
                    rgba(6, 53, 34, 0.18) 100%
                ),

                url("kantor-desa.jpg");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            overflow: hidden;
        }

        .hero::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at 80% 25%,
                    rgba(255, 255, 255, 0.14),
                    transparent 30%
                );

            pointer-events: none;
        }

        .hero::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -1px;

            width: 100%;
            height: 140px;

            background:
                linear-gradient(
                    transparent,
                    var(--cream)
                );

            pointer-events: none;
        }

        .hero-container {
            width: min(1150px, 100%);

            margin: auto;

            position: relative;

            z-index: 2;
        }

        .hero-content {
            max-width: 720px;

            animation:
                heroUp 1s ease;
        }

        @keyframes heroUp {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .hero-small {
            display: inline-flex;

            align-items: center;

            gap: 9px;

            padding: 9px 15px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            background:
                rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);

            border-radius: 50px;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        .hero-small::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #a8d9b9;

            box-shadow:
                0 0 0 5px rgba(168, 217, 185, 0.12);
        }

        .hero h2 {
            font-size: 20px;

            font-weight: 500;

            color: #d2e5d9;

            margin-bottom: 5px;
        }

        .hero h1 {
            font-family: "Playfair Display", serif;

            font-size: clamp(60px, 9vw, 105px);

            line-height: 0.98;

            letter-spacing: -4px;

            margin-bottom: 25px;
        }

        .hero p {
            max-width: 620px;

            font-size: 17px;

            line-height: 1.8;

            color:
                rgba(255, 255, 255, 0.90);

            margin-bottom: 32px;
        }


        /* =====================================================
           HERO BUTTON
        ====================================================== */

        .hero-button {
            display: inline-flex;

            align-items: center;

            gap: 14px;

            padding:
                15px 22px
                15px 25px;

            background: white;

            color: var(--green);

            border-radius: 50px;

            font-weight: 700;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.18);

            transition: 0.35s;
        }

        .hero-button span {
            width: 32px;
            height: 32px;

            border-radius: 50%;

            background: var(--green);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            transition: 0.35s;
        }

        .hero-button:hover {
            transform: translateY(-5px);
        }

        .hero-button:hover span {
            transform: translateX(4px);
        }


        /* =====================================================
           HERO TAGS
        ====================================================== */

        .hero-tags {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 43px;
        }

        .tag {
            padding: 9px 15px;

            border-radius: 50px;

            background:
                rgba(255, 255, 255, 0.09);

            border:
                1px solid rgba(255, 255, 255, 0.16);

            backdrop-filter: blur(10px);

            font-size: 13px;

            color: #f7fff9;
        }


        /* =====================================================
           STATISTIK
        ====================================================== */

        .stats-wrapper {
            position: relative;

            z-index: 20;

            margin-top: -65px;

            padding: 0 25px;
        }

        .stats {
            width: min(1080px, 100%);

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            background:
                rgba(255, 255, 255, 0.98);

            border:
                1px solid #e2ebe5;

            border-radius: 30px;

            overflow: hidden;

            box-shadow: var(--shadow);
        }

        .stat {
            min-height: 160px;

            padding: 25px 15px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            border-right:
                1px solid #e4ebe6;
        }

        .stat:last-child {
            border-right: none;
        }

        .stat-number {
            font-family: "Playfair Display", serif;

            font-size: 43px;

            line-height: 1;

            font-weight: 800;

            color: var(--green);

            margin-bottom: 10px;
        }

        .stat-icon {
            font-size: 43px;

            line-height: 1;

            margin-bottom: 9px;
        }

        .stat-label {
            color: #77837d;

            font-size: 14px;

            font-weight: 500;
        }


        /* =====================================================
           SECTION
        ====================================================== */

        section {
            padding: 115px 25px;
        }

        .container {
            width: min(1100px, 100%);

            margin: auto;
        }

        .section-heading {
            margin-bottom: 55px;
        }

        .section-label {
            color: #6e9e7e;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 3px;

            margin-bottom: 13px;
        }

        .section-heading h2 {
            font-family: "Playfair Display", serif;

            color: var(--green);

            font-size:
                clamp(42px, 6vw, 68px);

            line-height: 1.08;

            letter-spacing: -2px;

            margin-bottom: 17px;
        }

        .section-heading p {
            max-width: 680px;

            color: var(--muted);

            font-size: 17px;
        }


        /* =====================================================
           PROFIL
        ====================================================== */

        .profil {
            background: var(--cream);
        }

        .profil-grid {
            display: grid;

            grid-template-columns:
                1.1fr 0.9fr;

            gap: 75px;

            align-items: center;
        }

        .profil-text h3 {
            font-family: "Playfair Display", serif;

            color: var(--green);

            font-size: 40px;

            margin-bottom: 20px;
        }

        .profil-text p {
            color: #65736b;

            font-size: 16px;

            margin-bottom: 17px;
        }

        .info-card {
            position: relative;

            background: white;

            border-radius: 28px;

            padding: 25px 30px;

            box-shadow: var(--shadow);

            border:
                1px solid #e6eee8;
        }

        .info-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 30px;

            width: 55px;
            height: 4px;

            background:
                var(--green-bright);

            border-radius:
                0 0 10px 10px;
        }

        .info-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 17px 0;

            border-bottom:
                1px solid #e9efeb;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row span {
            color: #7a857f;

            font-size: 14px;
        }

        .info-row strong {
            color: var(--green);

            text-align: right;

            font-size: 14px;
        }


        /* =====================================================
           SEJARAH
        ====================================================== */

        .sejarah {
            background: white;
        }

        .sejarah-box {
            position: relative;

            max-width: 950px;

            margin: auto;

            padding: 55px;

            background:
                linear-gradient(
                    135deg,
                    #eaf3ed,
                    #f5f9f6
                );

            border-radius: 35px;

            border:
                1px solid #dce9e0;

            box-shadow:
                0 20px 60px rgba(20, 60, 40, 0.07);
        }

        .sejarah-box::before {
            content: "“";

            position: absolute;

            top: 20px;
            left: 35px;

            font-family:
                "Playfair Display", serif;

            font-size: 95px;

            color: #c7dfcf;

            line-height: 1;
        }

        .sejarah-box p {
            position: relative;

            color: #53655b;

            font-size: 16px;

            margin-bottom: 20px;

            text-align: justify;
        }

        .sejarah-box p:first-child {
            padding-top: 30px;
        }

        .sejarah-box p:last-child {
            margin-bottom: 0;
        }


        /* =====================================================
           KEGIATAN
        ====================================================== */

        .kegiatan {
            background: var(--cream);
        }

        .kegiatan-intro {
            margin-bottom: 50px;
        }

        .activity-list {
            display: flex;

            flex-direction: column;

            gap: 25px;
        }

        .activity-card {
            position: relative;

            min-height: 430px;

            overflow: hidden;

            display: flex;

            align-items: flex-end;

            border-radius: 35px;

            background-color: #dce7df;

            background-size: cover;

            background-position: center;

            isolation: isolate;

            box-shadow:
                0 15px 45px rgba(20, 60, 40, 0.08);

            transition:
                0.45s ease;
        }

        .activity-card::before {
            content: "";

            position: absolute;

            inset: 0;

            z-index: -1;

            background:
                linear-gradient(
                    to top,
                    rgba(4, 18, 11, 0.95) 0%,
                    rgba(4, 18, 11, 0.62) 40%,
                    rgba(4, 18, 11, 0.04) 80%
                );
        }

        .activity-card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 30px 65px rgba(20, 60, 40, 0.15);
        }

        .activity-content {
            width: 100%;

            padding: 50px 60px;

            color: white;
        }

        .activity-number {
            display: inline-block;

            padding: 8px 15px;

            margin-bottom: 20px;

            border-radius: 50px;

            background:
                rgba(255, 255, 255, 0.10);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(8px);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2px;
        }

        .activity-content h3 {
            font-family:
                "Playfair Display", serif;

            font-size:
                clamp(39px, 5vw, 64px);

            line-height: 1;

            letter-spacing: -2px;

            margin-bottom: 14px;
        }

        .activity-content p {
            max-width: 650px;

            color:
                rgba(255, 255, 255, 0.83);

            font-size: 17px;
        }


        /* =====================================================
           GAMBAR KEGIATAN
        ====================================================== */

        .activity-1 {
            background-image:
                url("gotong-royong.jpg");
        }

        .activity-2 {
            background-image:
                url("kegiatan-warga.jpg");
        }

        .activity-3 {
            background-image:
                url("pertanian-desa.jpg");
        }

        .activity-4 {
            background-image:
                url("suasana-desa.jpg");
        }

        .activity-5 {
            background-image:
                url("keindahan-alam.jpg");
        }


        /* =====================================================
           POTENSI
        ====================================================== */

        .potensi {
            background: white;
        }

        .potensi-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }

        .potensi-card {
            position: relative;

            padding: 34px;

            background:
                linear-gradient(
                    145deg,
                    #f5f9f6,
                    #edf5ef
                );

            border-radius: 28px;

            border:
                1px solid #dfeae2;

            transition: 0.4s;
        }

        .potensi-card:hover {
            transform: translateY(-9px);

            box-shadow:
                0 25px 55px rgba(20, 60, 40, 0.10);
        }

        .potensi-icon {
            width: 62px;
            height: 62px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 23px;

            border-radius: 19px;

            background: white;

            font-size: 30px;

            box-shadow:
                0 10px 25px rgba(20, 60, 40, 0.07);
        }

        .potensi-card h3 {
            font-family:
                "Playfair Display", serif;

            color: var(--green);

            font-size: 27px;

            margin-bottom: 10px;
        }

        .potensi-card p {
            color: #69776f;

            font-size: 15px;
        }


        /* =====================================================
           KONTAK
        ====================================================== */

        .kontak {
            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(255, 255, 255, 0.09),
                    transparent 25%
                ),
                var(--green);

            color: white;
        }

        .kontak::before {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            border:
                1px solid rgba(255, 255, 255, 0.07);

            right: -120px;
            bottom: -170px;
        }

        .contact-wrapper {
            position: relative;

            z-index: 2;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 70px;

            align-items: center;
        }

        .contact-title .section-label {
            color: #9bc5aa;
        }

        .contact-title h2 {
            font-family:
                "Playfair Display", serif;

            font-size:
                clamp(43px, 6vw, 70px);

            line-height: 1.04;

            letter-spacing: -2px;

            margin-bottom: 22px;
        }

        .contact-title p {
            color: #c6d9ce;

            font-size: 16px;
        }

        .contact-cards {
            display: grid;

            gap: 13px;
        }

        .contact-card {
            display: flex;

            align-items: center;

            gap: 17px;

            padding: 20px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid rgba(255, 255, 255, 0.12);

            transition: 0.3s;
        }

        .contact-card:hover {
            transform: translateX(6px);

            background:
                rgba(255, 255, 255, 0.12);
        }

        .contact-icon {
            width: 47px;
            height: 47px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.10);

            font-size: 21px;
        }

        .contact-card h3 {
            color: #f5dc80;

            font-size: 14px;

            margin-bottom: 2px;
        }

        .contact-card p,
        .contact-card a {
            color: white;

            font-size: 14px;
        }

        .contact-card a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           SOCIAL MEDIA
        ====================================================== */

        .social-links {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 30px;
        }

        .social-link {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 10px 15px;

            border-radius: 50px;

            color: white;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 255, 255, 0.14);

            font-size: 13px;

            transition: 0.3s;
        }

        .social-link:hover {
            transform: translateY(-3px);

            background:
                rgba(255, 255, 255, 0.16);
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {
            background: #05291c;

            color: white;

            padding: 45px 25px;

            text-align: center;
        }

        .footer-logo {
            font-family:
                "Playfair Display", serif;

            font-size: 26px;

            margin-bottom: 9px;
        }

        footer p {
            color: #9db5a7;

            font-size: 13px;

            margin: 4px 0;
        }


        /* =====================================================
           BACK TO TOP
        ====================================================== */

        .back-top {
            position: fixed;

            right: 25px;
            bottom: 25px;

            width: 53px;
            height: 53px;

            border: none;

            border-radius: 17px;

            background: var(--green);

            color: white;

            font-size: 22px;

            cursor: pointer;

            z-index: 999;

            opacity: 0;

            visibility: hidden;

            transform: translateY(20px);

            transition: 0.3s;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.18);
        }

        .back-top.show {
            opacity: 1;

            visibility: visible;

            transform: translateY(0);
        }

        .back-top:hover {
            transform: translateY(-5px);
        }


        /* =====================================================
           SCROLL REVEAL
        ====================================================== */

        .reveal {
            opacity: 0;

            transform: translateY(35px);

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

        .reveal.active {
            opacity: 1;

            transform: translateY(0);
        }

                gap: 40px;

            .contact-wrapper {
                grid-template-columns: 1fr;

                gap: 45px;

            .potensi-grid {
                grid-template-columns:

            .stats {

            .stat:nth-child(3) {
                border-right:
                    1px solid #e2ebe5;
            }

            .activity-content {
                padding: 45px;
            }
