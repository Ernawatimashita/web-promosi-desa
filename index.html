<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desa Pusaka | Kecamatan Tebas, Kabupaten Sambas</title>

<meta name="description"
content="Website resmi Desa Pusaka, Kecamatan Tebas, Kabupaten Sambas, Kalimantan Barat. Informasi profil, sejarah, kegiatan, potensi dan fasilitas desa.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",Arial,sans-serif;
    background:#f3f8f4;
    color:#153f2c;
    line-height:1.7;
}

img{
    width:100%;
    display:block;
}

a{
    text-decoration:none;
}

button{
    font-family:inherit;
}


/* =====================================================
   WARNA
===================================================== */

:root{
    --hijau:#0d442c;
    --hijau-tua:#062f20;
    --hijau-muda:#dcece2;
    --hijau-terang:#2c8055;
    --putih:#ffffff;
    --abu:#68766f;
    --cream:#f3f8f4;
}


/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;
    top:0;
    left:0;
    width:100%;
    height:85px;
    z-index:1000;

    background:rgba(255,255,255,.96);
    backdrop-filter:blur(15px);

    border-bottom:1px solid #e3ebe5;
}

.navbar{
    width:min(1150px,calc(100% - 40px));
    height:100%;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}


/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--hijau);
}

.logo-icon{
    width:50px;
    height:50px;

    background:var(--hijau);
    color:white;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    box-shadow:0 8px 20px rgba(13,68,44,.15);
}

.logo-text{
    font-family:"Playfair Display",serif;
    font-size:25px;
    font-weight:800;
}


/* NAVIGATION */

nav{
    display:flex;
    align-items:center;
    gap:23px;
}

nav a{
    color:#214936;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:var(--hijau-terang);
}


/* MOBILE MENU BUTTON */

.menu-btn{
    display:none;

    width:45px;
    height:45px;

    border:none;
    border-radius:12px;

    background:var(--hijau);
    color:white;

    font-size:22px;
    cursor:pointer;
}


/* =====================================================
   MOBILE NAV
===================================================== */

.mobile-nav{
    display:none;

    position:absolute;
    top:85px;
    left:0;

    width:100%;

    background:white;

    border-bottom:1px solid #e3ebe5;

    padding:15px 20px;

    box-shadow:0 15px 30px rgba(0,0,0,.08);
}

.mobile-nav.active{
    display:block;
}

.mobile-nav a{
    display:block;

    padding:12px 10px;

    color:var(--hijau);
    font-weight:600;

    border-radius:10px;
}

.mobile-nav a:hover{
    background:var(--hijau-muda);
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:680px;

    display:flex;
    align-items:center;

    position:relative;

    color:white;

    background:
    linear-gradient(
        rgba(4,47,32,.72),
        rgba(4,47,32,.72)
    ),
    url("images/kantor-desa.jpg") center/cover no-repeat;
}

.hero-content{
    width:min(1100px,100%);

    margin:auto;

    padding:100px 25px;
}

.hero-label{
    display:inline-block;

    padding:9px 18px;

    border:1px solid rgba(255,255,255,.4);
    border-radius:50px;

    font-size:12px;
    font-weight:700;

    letter-spacing:2px;

    margin-bottom:22px;
}

.hero h1{
    max-width:850px;

    font-family:"Playfair Display",serif;

    font-size:clamp(48px,7vw,80px);

    line-height:1.08;

    margin-bottom:22px;
}

.hero p{
    max-width:700px;

    color:#dcece2;

    font-size:18px;

    margin-bottom:32px;
}

.hero-buttons{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:14px 23px;

    border-radius:50px;

    font-weight:700;

    transition:.3s;
}

.btn-primary{
    background:white;
    color:var(--hijau);
}

.btn-primary:hover{
    transform:translateY(-3px);
}

.btn-secondary{
    border:1px solid rgba(255,255,255,.5);
    color:white;
    background:rgba(255,255,255,.08);
}

.btn-secondary:hover{
    background:white;
    color:var(--hijau);
}


/* =====================================================
   SECTION
===================================================== */

section{
    scroll-margin-top:90px;
}

.container{
    width:min(1100px,100%);

    margin:auto;

    padding:90px 25px;
}

.section-heading{
    text-align:center;

    max-width:700px;

    margin:0 auto 50px;
}

.section-label{
    color:var(--hijau-terang);

    font-size:13px;
    font-weight:800;

    letter-spacing:2px;

    margin-bottom:10px;
}

.section-heading h2{
    font-family:"Playfair Display",serif;

    color:var(--hijau);

    font-size:clamp(34px,5vw,48px);

    line-height:1.15;

    margin-bottom:12px;
}

.section-heading p{
    color:var(--abu);

    font-size:16px;
}


/* =====================================================
   PROFIL
===================================================== */

.profile-grid{
    display:grid;

    grid-template-columns:1.1fr .9fr;

    gap:40px;

    align-items:center;
}

.profile-content h3{
    font-family:"Playfair Display",serif;

    color:var(--hijau);

    font-size:35px;

    line-height:1.2;

    margin-bottom:18px;
}

.profile-content p{
    color:var(--abu);

    margin-bottom:18px;
}

.profile-box{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;
}

.info-card{
    background:white;

    border:1px solid #e0eae3;

    border-radius:20px;

    padding:22px;

    box-shadow:0 10px 30px rgba(20,60,40,.06);
}

.info-icon{
    font-size:30px;

    margin-bottom:8px;
}

.info-card strong{
    display:block;

    color:var(--hijau);

    margin-bottom:3px;
}

.info-card span{
    color:var(--abu);

    font-size:14px;
}


/* =====================================================
   SEJARAH
===================================================== */

.history{
    background:white;
}

.history-box{
    background:#f3f8f4;

    border-radius:30px;

    padding:45px;

    border:1px solid #dfeae2;
}

.history-box h3{
    font-family:"Playfair Display",serif;

    color:var(--hijau);

    font-size:32px;

    margin-bottom:18px;
}

.history-box p{
    color:var(--abu);

    margin-bottom:18px;
}

.read-more{
    display:inline-flex;

    color:var(--hijau);

    font-weight:800;
}

.read-more:hover{
    color:var(--hijau-terang);
}


/* =====================================================
   KEGIATAN
===================================================== */

.activity-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:25px;
}

.activity-card{
    background:white;

    padding:32px;

    border-radius:25px;

    border:1px solid #e0eae3;

    box-shadow:0 12px 35px rgba(20,60,40,.06);

    transition:.3s;
}

.activity-card:hover{
    transform:translateY(-6px);

    box-shadow:0 20px 40px rgba(20,60,40,.11);
}

.activity-icon{
    width:60px;
    height:60px;

    border-radius:18px;

    background:var(--hijau-muda);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    margin-bottom:20px;
}

.activity-card h3{
    font-family:"Playfair Display",serif;

    color:var(--hijau);

    font-size:25px;

    margin-bottom:10px;
}

.activity-card p{
    color:var(--abu);

    font-size:15px;
}


/* =====================================================
   POTENSI
===================================================== */

.potential{
    background:#edf5ef;
}

.potential-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;
}

.potential-card{
    background:white;

    padding:28px 22px;

    text-align:center;

    border-radius:24px;

    border:1px solid #dfebe2;

    transition:.3s;
}

.potential-card:hover{
    transform:translateY(-5px);
}

.potential-icon{
    font-size:45px;

    margin-bottom:12px;
}

.potential-card h3{
    font-family:"Playfair Display",serif;

    color:var(--hijau);

    font-size:23px;

    margin-bottom:8px;
}

.potential-card p{
    color:var(--abu);

    font-size:14px;
}


/* =====================================================
   FASILITAS
===================================================== */

.facility-section{
    background:white;
}

.facility-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;
}

.facility-card{
    background:white;

    overflow:hidden;

    border-radius:22px;

    border:1px solid #e0eae3;

    box-shadow:0 10px 30px rgba(20,60,40,.07);

    transition:.35s;
}

.facility-card:hover{
    transform:translateY(-7px);

    box-shadow:0 18px 40px rgba(20,60,40,.13);
}

.facility-image{
    height:190px;

    overflow:hidden;

    background:#dcece2;
}

.facility-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.4s;
}

.facility-card:hover .facility-image img{
    transform:scale(1.06);
}

.facility-body{
    padding:22px;
}

.facility-body h3{
    font-family:"Playfair Display",serif;

    color:var(--hijau);

    font-size:22px;

    margin-bottom:8px;
}

.facility-body p{
    color:var(--abu);

    font-size:14px;

    line-height:1.6;

    margin-bottom:17px;
}

.facility-link{
    display:inline-flex;

    color:var(--hijau);

    font-weight:800;

    font-size:14px;
}

.facility-link:hover{
    color:var(--hijau-terang);
}

.facility-button{
    text-align:center;

    margin-top:40px;
}


/* =====================================================
   CTA
===================================================== */

.cta{
    background:
    linear-gradient(
        135deg,
        #0d442c,
        #176443
    );

    color:white;

    text-align:center;
}

.cta-content{
    max-width:750px;

    margin:auto;
}

.cta h2{
    font-family:"Playfair Display",serif;

    font-size:45px;

    line-height:1.15;

    margin-bottom:15px;
}

.cta p{
    color:#dcece2;

    margin-bottom:28px;
}


/* =====================================================
   KONTAK
===================================================== */

.contact-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:25px;
}

.contact-card{
    background:white;

    padding:30px;

    border-radius:25px;

    text-align:center;

    border:1px solid #e0eae3;

    box-shadow:0 10px 30px rgba(20,60,40,.06);
}

.contact-icon{
    font-size:38px;

    margin-bottom:12px;
}

.contact-card h3{
    font-family:"Playfair Display",serif;

    color:var(--hijau);

    font-size:23px;

    margin-bottom:8px;
}

.contact-card p{
    color:var(--abu);

    font-size:14px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    background:var(--hijau-tua);

    color:white;

    padding:55px 25px 25px;
}

.footer-container{
    width:min(1100px,100%);

    margin:auto;

    display:grid;

    grid-template-columns:1.5fr 1fr 1fr;

    gap:40px;

    padding-bottom:35px;
}

.footer-logo{
    font-family:"Playfair Display",serif;

    font-size:28px;

    margin-bottom:10px;
}

.footer-about p{
    color:#a9c0b3;

    font-size:14px;

    max-width:400px;
}

.footer-column h3{
    font-family:"Playfair Display",serif;

    font-size:20px;

    margin-bottom:14px;
}

.footer-column a{
    display:block;

    color:#a9c0b3;

    font-size:14px;

    margin:7px 0;

    transition:.3s;
}

.footer-column a:hover{
    color:white;
}

.footer-bottom{
    width:min(1100px,100%);

    margin:auto;

    padding-top:22px;

    border-top:1px solid rgba(255,255,255,.12);

    text-align:center;

    color:#a9c0b3;

    font-size:13px;
}


/* =====================================================
   BACK TO TOP
===================================================== */

.back-top{
    position:fixed;

    right:20px;
    bottom:20px;

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:var(--hijau);

    color:white;

    font-size:20px;

    cursor:pointer;

    box-shadow:0 8px 25px rgba(0,0,0,.2);

    z-index:100;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:950px){

    nav{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .profile-grid{
        grid-template-columns:1fr;
    }

    .facility-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .potential-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .footer-container{
        grid-template-columns:1fr 1fr;
    }
}


@media(max-width:700px){

    .hero{
        min-height:600px;
    }

    .hero-content{
        padding:80px 20px;
    }

    .hero h1{
        font-size:48px;
    }

    .hero p{
        font-size:16px;
    }

    .container{
        padding:70px 20px;
    }

    .profile-box{
        grid-template-columns:1fr;
    }

    .activity-grid{
        grid-template-columns:1fr;
    }

    .potential-grid{
        grid-template-columns:1fr 1fr;
    }

    .facility-grid{
        grid-template-columns:1fr;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

    .history-box{
        padding:30px 25px;
    }

    .cta h2{
        font-size:35px;
    }

    .footer-container{
        grid-template-columns:1fr;
    }

}


@media(max-width:420px){

    .navbar{
        width:calc(100% - 25px);
    }

    .logo-text{
        font-size:21px;
    }

    .logo-icon{
        width:45px;
        height:45px;
    }

    .hero h1{
        font-size:41px;
    }

    .potential-grid{
        grid-template-columns:1fr;
    }

    .hero-buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>
