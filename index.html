/* =====================================================
   ROOT
===================================================== */

:root{
    --green:#123d27;
    --green2:#23734a;
    --green3:#dff0e2;

    --light-green:#eaf7ec;
    --light-green2:#dff1e2;
    --light-green3:#cce8d1;

    --gold:#e5bd61;

    --cream:#f4fbf5;

    --dark:#102119;
    --text:#64736a;

    --white:#fff;

    --line:#dce9df;

    --shadow:0 20px 60px rgba(15,55,35,.12);

    --radius:28px;
}


/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",Arial,sans-serif;
    color:var(--dark);
    background:#fff;
    line-height:1.7;
    overflow-x:hidden;
}

body.menu-open{
    overflow:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    width:100%;
    display:block;
    object-fit:cover;
}

button{
    font:inherit;
}

.container{
    width:min(1160px,calc(100% - 40px));
    margin:auto;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    position:fixed;
    z-index:1000;

    top:0;
    left:0;
    right:0;

    padding:14px 0;

    transition:.3s ease;
}

.navbar.scrolled{
    background:rgba(255,255,255,.95);

    backdrop-filter:blur(18px);

    box-shadow:0 5px 30px rgba(10,50,30,.08);
}

.nav-inner{
    width:min(1160px,calc(100% - 40px));

    margin:auto;

    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:25px;
