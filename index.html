<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Desa Pusaka | Pesona Alam, Budaya & Masyarakat</title>

<meta name="description" content="Website promosi Desa Pusaka yang menampilkan potensi wisata, pertanian, UMKM, budaya, kegiatan masyarakat, dan keindahan desa.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --green:#123d27;
    --green2:#23734a;
    --green3:#dff0e2;

    /* HIJAU MUDA UNTUK BAGIAN DUSUN */
    --light-green:#e7f5e8;
    --light-green2:#d9efdc;
    --light-green3:#c8e8ce;

    --gold:#e5bd61;
    --cream:#f7f8f2;
    --dark:#102119;
    --text:#64736a;
    --white:#fff;
    --line:#e4ebe5;

    --shadow:0 20px 60px rgba(15,55,35,.12);
    --radius:26px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",Arial,sans-serif;
    color:var(--dark);
    background:#fff;
    line-height:1.7;
    overflow-x:hidden;
}

body.menu-open{
    overflow:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    width:100%;
    display:block;
    object-fit:cover;
}

button{
    font:inherit;
}

.container{
    width:min(1160px,calc(100% - 40px));
    margin:auto;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    padding:14px 0;
    transition:.3s ease;
}

.navbar.scrolled{
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(18px);
    box-shadow:0 5px 30px rgba(10,50,30,.08);
}

.nav-inner{
    width:min(1160px,calc(100% - 40px));
    margin:auto;
    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;

    color:#fff;
    font-weight:800;
    font-size:1.12rem;
    white-space:nowrap;
}

.navbar.scrolled .logo{
    color:var(--green);
}

.logo-icon{
    width:43px;
    height:43px;

    display:grid;
    place-items:center;

    border-radius:14px;
    background:var(--green);
    color:#fff;

    box-shadow:0 8px 20px rgba(18,61,39,.2);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:3px;
}

.nav-links a{
    color:#fff;
    padding:10px 13px;

    border-radius:12px;

    font-weight:600;
    font-size:.92rem;

    transition:.25s;
}

.navbar.scrolled .nav-links a{
    color:#47564d;
}

.nav-links a:hover,
.nav-links a.active{
    background:rgba(255,255,255,.14);
    color:#fff;
}

.navbar.scrolled .nav-links a:hover,
.navbar.scrolled .nav-links a.active{
    background:#e9f4eb;
    color:var(--green);
}

.nav-links .nav-contact{
    margin-left:8px;
    background:#fff;
    color:var(--green)!important;
    padding:11px 18px;
}

.navbar.scrolled .nav-links .nav-contact{
    background:var(--green);
    color:#fff!important;
}

.menu-btn{
    display:none;

    width:44px;
    height:44px;

    border:0;
    border-radius:12px;

    background:var(--green);
    color:#fff;

    cursor:pointer;
    font-size:1.25rem;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;

    position:relative;

    display:flex;
    align-items:center;

    overflow:hidden;

    color:#fff;

    background:
        linear-gradient(
            90deg,
            rgba(7,35,20,.94) 0%,
            rgba(7,35,20,.74) 42%,
            rgba(7,35,20,.20) 100%
        ),
        url("assets/img/desa.jpg") center/cover no-repeat,
        #477b55;
}

.hero::before{
    content:"";

    position:absolute;

    width:500px;
    height:500px;

    right:-180px;
    top:100px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:50%;
}

.hero::after{
    content:"";

    position:absolute;

    left:-10%;
    right:-10%;
    bottom:-80px;

    height:170px;

    background:#fff;

    border-radius:50% 50% 0 0/100% 100% 0 0;
}

.hero-content{
    position:relative;
    z-index:2;

    padding:155px 0 155px;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:8px 14px;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(255,255,255,.10);

    border-radius:100px;

    backdrop-filter:blur(8px);

    font-size:.76rem;
    font-weight:800;
    letter-spacing:.13em;
}

.hero h1{
    max-width:900px;

    margin:22px 0 20px;

    font-family:"Playfair Display",Georgia,serif;

    font-size:clamp(3.5rem,7.8vw,7rem);

    line-height:.96;

    letter-spacing:-.045em;
}

.hero h1 span{
    color:var(--gold);
}

.hero-description{
    max-width:640px;

    color:rgba(255,255,255,.86);

    font-size:1.08rem;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;

    gap:12px;

    margin-top:30px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    min-height:48px;

    padding:12px 20px;

    border:2px solid var(--green);
    border-radius:14px;

    background:var(--green);
    color:#fff;

    font-weight:800;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);

    box-shadow:0 12px 30px rgba(18,61,39,.22);
}

.btn-light{
    background:#fff;
    border-color:#fff;
    color:var(--green);
}

.btn-outline{
    background:transparent;
    border-color:rgba(255,255,255,.35);
    color:#fff;
}

.hero-features{
    display:flex;
    flex-wrap:wrap;

    gap:9px;

    margin-top:30px;
}

.hero-feature{
    padding:7px 12px;

    border-radius:100px;

    background:rgba(0,0,0,.18);

    border:1px solid rgba(255,255,255,.16);

    color:#fff;

    font-size:.84rem;
}


/* =====================================================
   GENERAL
===================================================== */

.section{
    padding:100px 0;
}

.section-soft{
    background:var(--cream);
}

.section-heading{
    max-width:720px;

    margin:0 auto 48px;

    text-align:center;
}

.section-heading.left{
    margin-left:0;
    text-align:left;
}

.section-label{
    display:inline-block;

    color:var(--green2);

    font-size:.76rem;
    font-weight:900;

    letter-spacing:.16em;

    text-transform:uppercase;
}

.section-heading h2{
    margin:8px 0 12px;

    font-family:"Playfair Display",Georgia,serif;

    font-size:clamp(2.25rem,4.5vw,3.6rem);

    line-height:1.08;

    letter-spacing:-.035em;
}

.section-heading p{
    color:var(--text);
}


/* =====================================================
   ABOUT
===================================================== */

.about-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:65px;

    align-items:center;
}

.image-stack{
    position:relative;

    padding-right:30px;
    padding-bottom:30px;
}

.main-photo{
    height:510px;

    border-radius:30px;

    box-shadow:var(--shadow);
}

.small-photo{
    position:absolute;

    right:0;
    bottom:0;

    width:210px;
    height:170px;

    border:8px solid #fff;

    border-radius:22px;

    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.photo-tag{
    position:absolute;

    left:25px;
    top:25px;

    padding:10px 14px;

    background:#fff;

    border-radius:13px;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

    font-size:.82rem;

    font-weight:800;

    color:var(--green);
}

.about-text h3{
    font-family:"Playfair Display",Georgia,serif;

    font-size:clamp(2rem,4vw,3.2rem);

    line-height:1.08;

    margin:8px 0 18px;
}

.about-text h3 span{
    color:var(--green2);
}

.about-text p{
    color:var(--text);

    margin-bottom:14px;
}

.check-list{
    display:grid;

    gap:12px;

    margin:25px 0 28px;
}

.check-item{
    display:flex;

    align-items:center;

    gap:11px;

    font-weight:700;
}

.check-icon{
    width:36px;
    height:36px;

    flex:0 0 36px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:var(--green3);
}


/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;

    margin-top:65px;
}

.stat{
    padding:28px 18px;

    text-align:center;

    background:#fff;

    border:1px solid var(--line);

    border-radius:20px;

    transition:.25s;
}

.stat:hover{
    transform:translateY(-4px);
}

.stat strong{
    display:block;

    margin-bottom:4px;

    color:var(--green);

    font-family:"Playfair Display",Georgia,serif;

    font-size:2.4rem;

    line-height:1;
}

.stat span{
    color:var(--text);

    font-size:.9rem;

    font-weight:700;
}


/* =====================================================
   DUSUN PUTING & DUSUN BELIUNG
===================================================== */

.dusun-section{
    padding:100px 0;

    /* BACKGROUND HIJAU MUDA */
    background:linear-gradient(
        135deg,
        #edf8ee 0%,
        #dff1e2 50%,
        #eaf7eb 100%
    );
}

.dusun-heading{
    max-width:720px;

    margin:0 auto 45px;

    text-align:center;
}

.dusun-heading .section-label{
    color:#23734a;
}

.dusun-heading h2{
    margin:8px 0 12px;

    font-family:"Playfair Display",Georgia,serif;

    font-size:clamp(2.2rem,4.5vw,3.5rem);

    line-height:1.08;

    color:#123d27;
}

.dusun-heading p{
    color:#5e7567;
}

.dusun-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:28px;
}

.dusun-card{
    position:relative;

    padding:40px;

    overflow:hidden;

    background:#f8fff9;

    border:2px solid #cde7d1;

    border-radius:28px;

    box-shadow:
        0 15px 40px rgba(35,115,74,.08);

    transition:.35s ease;
}

.dusun-card:hover{
    transform:translateY(-8px);

    background:#fff;

    border-color:#9dccaa;

    box-shadow:
        0 25px 55px rgba(35,115,74,.16);
}

.dusun-card::after{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:-70px;
    top:-70px;
