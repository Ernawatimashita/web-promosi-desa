        /* =====================================================
           ROOT
        ===================================================== */

        :root {
            --green: #123d27;
            --green2: #23734a;
            --green3: #dff0e2;

            --cream: #f4fbf5;

            --dark: #102119;
            --text: #64736a;

            --white: #ffffff;

            --line: #dce9df;

            --gold: #e5bd61;

            --shadow: 0 20px 60px rgba(15, 55, 35, .12);

            --radius: 28px;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "DM Sans", Arial, sans-serif;
            color: var(--dark);
            background: white;
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            width: 100%;
            display: block;
        }

        button {
            font: inherit;
        }

        .container {
            width: min(1160px, calc(100% - 40px));
            margin: auto;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

            padding: 14px 0;

            transition: .3s ease;
        }

        .navbar.scrolled {
            background: rgba(255, 255, 255, .96);

            backdrop-filter: blur(15px);

            box-shadow: 0 5px 30px rgba(10, 50, 30, .08);
        }

        .nav-inner {
            width: min(1160px, calc(100% - 40px));

            min-height: 64px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            display: flex;

            align-items: center;

            gap: 10px;

            color: white;

            font-family: "Playfair Display", serif;

            font-size: 22px;

            font-weight: 800;

            white-space: nowrap;
        }

        .navbar.scrolled .logo {
            color: var(--green);
        }

        .logo-icon {
            width: 43px;
            height: 43px;

            display: grid;

            place-items: center;

            border-radius: 13px;

            background: var(--green);

            color: white;

            font-size: 21px;
        }

        .nav-menu {
            display: flex;

            align-items: center;

            gap: 5px;

            list-style: none;
        }

        .nav-menu a {
            padding: 10px 13px;

            color: white;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 700;

            transition: .25s;
        }

        .navbar.scrolled .nav-menu a {
            color: #47564d;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: rgba(255, 255, 255, .14);

            color: white;
        }

        .navbar.scrolled .nav-menu a:hover,
        .navbar.scrolled .nav-menu a.active {
            background: var(--green3);

            color: var(--green);
        }

        .nav-contact {
            background: white !important;

            color: var(--green) !important;

            padding: 11px 18px !important;
        }

        .navbar.scrolled .nav-contact {
            background: var(--green) !important;

            color: white !important;
        }

        .menu-toggle {
            display: none;

            width: 44px;
            height: 44px;

            border: 0;

            border-radius: 12px;

            background: var(--green);

            color: white;

            cursor: pointer;

            font-size: 22px;
        }

           HERO
        ===================================================== */

            position: relative;

            color: white;

                ),
                url("images/hero-desa.jpg")
                center / cover no-repeat;

            padding-top: 100px;
        }

        .hero-content {
            max-width: 700px;

            padding: 80px 0;
        }

        .hero-label {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 15px;

            border: 1px solid rgba(255, 255, 255, .25);

            background: rgba(255, 255, 255, .10);

            border-radius: 50px;

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 20px;
        }

            font-family: "Playfair Display", serif;

            font-size: clamp(48px, 7vw, 82px);

            line-height: 1;

            letter-spacing: -.04em;

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--gold);
        }
