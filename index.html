/* =========================================================
   ROOT
========================================================= */

:root {
    --green-dark: #0b2f1d;
    --green: #123d27;
    --green-light: #28784f;
    --green-soft: #e7f3e9;

    --cream: #f7faf5;
    --cream-dark: #eef5ed;

    --gold: #d9b65d;
    --gold-light: #f0d98c;

    --dark: #14231b;
    --text: #68766d;
    --white: #ffffff;

    --line: #dce8de;

    --shadow-sm: 0 10px 30px rgba(12, 52, 31, .08);
    --shadow: 0 25px 70px rgba(12, 52, 31, .13);

    --radius: 28px;

    --transition: .35s ease;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "DM Sans", Arial, sans-serif;
    color: var(--dark);
    background: #fff;
    line-height: 1.7;
    overflow-x: hidden;
}

body.menu-open {
    overflow: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}

img {
    width: 100%;
    display: block;
}

.container {
    width: min(1160px, calc(100% - 40px));
    margin: auto;
}

section {
    scroll-margin-top: 90px;
}


/* =========================================================
   SCROLL PROGRESS
========================================================= */

.scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 4px;
    background: linear-gradient(
        90deg,
        var(--gold),
        var(--green-light)
    );
    z-index: 9999;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 15px 0;
    transition: var(--transition);
}

.navbar.scrolled {
    padding: 9px 0;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(18px);

    box-shadow: 0 8px 35px rgba(10,50,30,.08);

.nav-inner {
    min-height: 62px;
    display: flex;

    font-weight: 800;
    white-space: nowrap;
}

.navbar.scrolled .logo {
    color: var(--green);
}

.logo-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.25);
    font-size: 21px;
    transition: var(--transition);
}

.navbar.scrolled .logo-icon {
    background: var(--green);
    border-color: var(--green);
}

.nav-menu {
    display: flex;
    align-items: center;
    gap: 4px;
    list-style: none;
}

.nav-menu a {
    position: relative;
    display: block;
    padding: 10px 12px;
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    transition: var(--transition);
}

.navbar.scrolled .nav-menu a {
    color: #47564d;
}

.nav-menu a:hover,
.nav-menu a.active {
    background: rgba(255,255,255,.14);
    color: #fff;
}

.navbar.scrolled .nav-menu a:hover,
.navbar.scrolled .nav-menu a.active {
    background: var(--green-soft);
    color: var(--green);
}

.nav-contact {
    background: #fff !important;
    color: var(--green) !important;
    padding-left: 17px !important;
    padding-right: 17px !important;
}

.navbar.scrolled .nav-contact {
    background: var(--green) !important;
    color: #fff !important;
}

.menu-toggle {
    display: none;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 13px;
    background: var(--green);
    color: #fff;
    cursor: pointer;
    font-size: 21px;
}

    color: #fff;

}
