<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontak | Desa Pusaka</title>

    <meta name="description"
        content="Halaman kontak Desa Pusaka untuk mendapatkan informasi, lokasi desa, dan terhubung melalui Facebook.">

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {
            --green: #123d27;
            --green2: #23734a;
            --green3: #dff0e2;

            --cream: #f4fbf5;

            --dark: #102119;
            --text: #64736a;

            --white: #ffffff;

            --line: #dce9df;

            --gold: #e5bd61;

            --shadow: 0 20px 60px rgba(15, 55, 35, .12);

            --radius: 24px;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "DM Sans", Arial, sans-serif;

            background: var(--cream);

            color: var(--dark);

            line-height: 1.7;

            overflow-x: hidden;
        }

        a {
            text-decoration: none;

            color: inherit;
        }

        button {
            font: inherit;
        }

        .container {
            width: min(1160px, calc(100% - 40px));

            margin: auto;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

            background: rgba(255, 255, 255, .96);

            backdrop-filter: blur(15px);

            box-shadow: 0 5px 25px rgba(10, 50, 30, .08);
        }

        .nav-inner {
            min-height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            display: flex;

            align-items: center;

            gap: 10px;

            color: var(--green);

            font-family: "Playfair Display", serif;

            font-size: 23px;

            font-weight: 800;

            white-space: nowrap;
        }

        .logo-icon {
            width: 43px;
            height: 43px;

            display: grid;

            place-items: center;

            border-radius: 12px;

            background: var(--green);

            color: white;

            font-size: 21px;
        }


        /* =====================================================
           MENU
        ===================================================== */

        .nav-menu {
            display: flex;

            align-items: center;

            gap: 7px;

            list-style: none;
        }

        .nav-menu a {
            padding: 10px 13px;

            border-radius: 10px;

            color: #47564d;

            font-size: 14px;

            font-weight: 700;

            transition: .25s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: var(--green3);

            color: var(--green);
        }

        .nav-contact {
            background: var(--green) !important;

            color: white !important;
        }

        .nav-contact:hover {
            background: var(--green2) !important;
        }


        /* =====================================================
           MENU MOBILE
        ===================================================== */

        .menu-toggle {
            display: none;

            width: 44px;
            height: 44px;

            border: 0;

            border-radius: 12px;

            background: var(--green);

            color: white;

            font-size: 22px;

            cursor: pointer;
        }


        /* =====================================================
           HERO KONTAK
        ===================================================== */

        .contact-hero {
            min-height: 440px;

            padding-top: 72px;

            display: flex;

            align-items: center;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    rgba(7, 42, 23, .90),
                    rgba(7, 42, 23, .90)
                ),
                url("images/hero-desa.jpg")
                center / cover no-repeat;
        }

        .hero-content {
            width: 100%;

            max-width: 780px;

            margin: auto;
        }

        .hero-label {
            display: inline-block;

            padding: 8px 16px;

            margin-bottom: 18px;

            border: 1px solid rgba(255,255,255,.25);

            border-radius: 50px;

            background: rgba(255,255,255,.10);

            font-size: 13px;

            font-weight: 800;
        }

        .contact-hero h1 {
            margin-bottom: 15px;

            font-family: "Playfair Display", serif;

            font-size: clamp(42px, 7vw, 65px);

            line-height: 1.1;
        }

        .contact-hero h1 span {
            color: var(--gold);
        }

        .contact-hero p {
            max-width: 650px;

            margin: auto;

            color: rgba(255,255,255,.88);

            font-size: 17px;
        }


        /* =====================================================
           CONTACT SECTION
        ===================================================== */

        .contact-section {
            padding: 90px 0;
        }

        .section-title {
            max-width: 700px;

            margin: 0 auto 50px;

            text-align: center;
        }

        .section-title .label {
            display: inline-block;

            color: var(--green2);

            font-size: 13px;

            font-weight: 900;

            letter-spacing: .12em;

            text-transform: uppercase;
        }

        .section-title h2 {
            margin: 8px 0 14px;

            color: var(--green);

            font-family: "Playfair Display", serif;

            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.15;
        }

        .section-title p {
            color: var(--text);
        }


        /* =====================================================
           CONTACT GRID
        ===================================================== */

        .contact-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 30px;
        }

        .contact-card {
            padding: 35px;

            background: white;

            border: 1px solid var(--line);

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            transition: .3s ease;
        }

        .contact-card:hover {
            transform: translateY(-5px);
        }


        /* =====================================================
           ICON
        ===================================================== */

        .contact-icon {
            width: 58px;
            height: 58px;

            display: grid;

            place-items: center;

            margin-bottom: 20px;

            border-radius: 17px;

            background: var(--green3);

            color: var(--green);

            font-size: 27px;
        }


        /* =====================================================
           JUDUL CARD
        ===================================================== */

        .contact-card h3 {
            margin-bottom: 10px;

            color: var(--green);

            font-family: "Playfair Display", serif;

            font-size: 27px;
        }

        .contact-card p {
            color: var(--text);

            margin-bottom: 20px;
        }


        /* =====================================================
           FACEBOOK
        ===================================================== */

        .facebook-card {
            background:
                linear-gradient(
                    135deg,
                    #f8fff9,
                    #eaf7ec
                );
        }

        .facebook-icon {
            background: #1877f2;

            color: white;

            font-weight: 800;

            font-family: Arial, sans-serif;
        }

        .facebook-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 13px 20px;

            border-radius: 12px;

            background: #1877f2;

            color: white;

            font-weight: 800;

            transition: .25s ease;
        }

        .facebook-button:hover {
            transform: translateY(-2px);

            background: #0d65d9;

            box-shadow: 0 10px 25px rgba(24,119,242,.20);
        }


        /* =====================================================
           INFO DESA
        ===================================================== */

        .info-list {
            display: grid;

            gap: 15px;

            margin-top: 20px;
        }

        .info-item {
            display: flex;

            align-items: flex-start;

            gap: 14px;

            padding: 15px;

            border-radius: 14px;

            background: var(--cream);
        }

        .info-item-icon {
            min-width: 40px;

            height: 40px;

            display: grid;

            place-items: center;

            border-radius: 10px;

            background: var(--green3);

            color: var(--green);

            font-size: 18px;
        }

        .info-item strong {
            display: block;

            color: var(--green);

            margin-bottom: 2px;
        }

        .info-item span {
            color: var(--text);

            font-size: 14px;
        }


        /* =====================================================
           TOMBOL LOKASI
        ===================================================== */

        .location-button-wrapper {
            margin-top: 25px;
        }

        .location-button {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            width: 100%;

            padding: 14px 20px;

            border-radius: 13px;

            background: var(--green);

            color: white;

            font-weight: 800;

            text-align: center;

            transition: .25s ease;

            box-shadow: 0 10px 25px rgba(18,61,39,.12);
        }

        .location-button:hover {
            background: var(--green2);

            transform: translateY(-3px);

            box-shadow: 0 15px 30px rgba(18,61,39,.20);
        }


        /* =====================================================
           PESAN
        ===================================================== */

        .message-box {
            margin-top: 30px;

            padding: 40px 35px;

            background: var(--green);

            border-radius: var(--radius);

            color: white;

            text-align: center;

            box-shadow: var(--shadow);
        }

        .message-box h3 {
            margin-bottom: 10px;

            font-family: "Playfair Display", serif;

            font-size: 30px;
        }
