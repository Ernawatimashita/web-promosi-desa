<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Desa Pusaka | Profil Desa</title>

<meta name="description"
      content="Website Desa Pusaka yang menampilkan profil, sejarah, kegiatan, galeri dan informasi desa.">

<!-- =====================================================
     GOOGLE FONT
===================================================== -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "DM Sans", sans-serif;
    background: #f4f8f4;
    color: #103f2b;
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}


/* =========================================================
   WARNA
========================================================= */

:root {

    --green-dark: #0d422b;

    --green: #125034;

    --green-light: #dfece3;

    --cream: #f4f8f4;

    --white: #ffffff;

    --gray: #69736f;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    width: 100%;

    height: 105px;

    background: rgba(255,255,255,0.98);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 38px;

    position: sticky;

    top: 0;

    z-index: 1000;

    box-shadow:
        0 3px 20px rgba(0,0,0,0.04);

}


/* =========================================================
   LOGO
========================================================= */

.logo-area {

    display: flex;

    align-items: center;

    gap: 18px;

}

.logo-box {

    width: 74px;

    height: 74px;

    background: var(--green-dark);

    border-radius: 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 40px;

}

.logo-text {

    font-family: "Playfair Display", serif;

    font-weight: 700;

    font-size: 34px;

    color: var(--green-dark);

}


/* =========================================================
   MENU DESKTOP
========================================================= */

.desktop-menu {

    display: flex;

    align-items: center;

    gap: 28px;

}

.desktop-menu a {

    color: #284b3b;

    font-weight: 600;

    font-size: 15px;

    transition: 0.3s;

}

.desktop-menu a:hover {

    color: #0b7a45;

}


/* =========================================================
   TOMBOL HAMBURGER
========================================================= */

.menu-button {

    width: 80px;

    height: 80px;

    border: none;

    border-radius: 22px;

    background: var(--green-dark);

    color: white;

    cursor: pointer;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 0;

}

.menu-button span {

    display: block;

    width: 31px;

    height: 3px;

    background: white;

    margin: 5px 0;

    border-radius: 5px;

    transition: 0.3s;

}


/* =========================================================
   ANIMASI HAMBURGER MENJADI X
========================================================= */

.menu-button.active span:nth-child(1) {

    transform:
        translateY(13px)
        rotate(45deg);

}

.menu-button.active span:nth-child(2) {

    opacity: 0;

}

.menu-button.active span:nth-child(3) {

    transform:
        translateY(-13px)
        rotate(-45deg);

}


/* =========================================================
   MOBILE MENU
========================================================= */

.mobile-menu {

    position: fixed;

    top: 105px;

    right: 0;

    width: 300px;

    min-height:
        calc(100vh - 105px);

    background: white;

    padding: 30px 25px;

    transform: translateX(100%);

    transition:
        transform 0.35s ease;

    z-index: 999;

    box-shadow:
        -8px 10px 30px
        rgba(0,0,0,0.12);

}

.mobile-menu.active {

    transform: translateX(0);

}

.mobile-menu a {

    display: block;

    padding: 18px 15px;

    border-bottom:
        1px solid #e8eee9;

    font-size: 17px;

    font-weight: 600;

    color: var(--green-dark);

    transition: 0.3s;

}

.mobile-menu a:hover {

    background: #eff7f1;

    padding-left: 22px;

}


/* =========================================================
   OVERLAY
========================================================= */

.menu-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.35);

    z-index: 998;

    opacity: 0;

    visibility: hidden;

    transition: 0.3s;

}

.menu-overlay.active {

    opacity: 1;

    visibility: visible;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    min-height: 680px;

    background:

        linear-gradient(
            120deg,
            rgba(8,53,35,0.97),
            rgba(8,53,35,0.60)
        ),

        url("images/desa.jpg");

    background-size: cover;

    background-position: center;

    display: flex;

    align-items: center;

    padding: 100px 7%;

}

.hero-content {

    max-width: 780px;

    color: white;

}

.hero-label {

    display: inline-block;

    border:
        1px solid
        rgba(255,255,255,0.4);

    padding: 12px 22px;

    border-radius: 50px;

    letter-spacing: 2px;

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 25px;

}

.hero h1 {

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(50px,7vw,90px);

    line-height: 1.02;

    margin-bottom: 25px;

}

.hero p {

    font-size: 20px;

    line-height: 1.7;

    color:
        rgba(255,255,255,0.88);

    max-width: 650px;

}

.hero-button {

    display: inline-block;

    margin-top: 35px;

    background: white;

    color: var(--green-dark);

    padding: 17px 30px;

    border-radius: 50px;

    font-weight: 700;

    transition: 0.3s;

}

.hero-button:hover {

    transform:
        translateY(-3px);

}


/* =========================================================
   SECTION
========================================================= */

.section {

    padding: 90px 5%;

}

.section-title {

    text-align: center;

    margin-bottom: 50px;

}

.section-title small {

    display: block;

    color: #6b927c;

    letter-spacing: 3px;

    font-weight: 700;

    margin-bottom: 12px;

}

.section-title h2 {

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(36px,5vw,55px);

    color: var(--green-dark);

}


/* =========================================================
   CHIP
========================================================= */

.chips {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 12px;

    margin-bottom: 55px;

}

.chip {

    padding: 13px 24px;

    border:
        1px solid #c9d9cf;

    border-radius: 50px;

    background:
        rgba(255,255,255,0.5);

    font-size: 16px;

    color: #365b49;

}


/* =========================================================
   STATISTIK
========================================================= */

.stats {

    max-width: 1000px;

    margin: 0 auto;

    background: white;

    border-radius: 32px;

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    overflow: hidden;

    box-shadow:
        0 20px 50px
        rgba(20,70,45,0.08);

}

.stat {

    min-height: 190px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

    border-right:
        1px solid #dbe5df;

}

.stat:last-child {

    border-right: none;

}

.stat-number {

    font-family:
        "Playfair Display",
        serif;

    font-size: 43px;

    font-weight: 700;

    color: var(--green-dark);

    margin-bottom: 10px;

}

.stat-label {

    font-size: 16px;

    color: #727c77;

}


/* =========================================================
   SEJARAH
========================================================= */

.history-box {

    max-width: 900px;

    margin: auto;

    background: white;

    padding: 40px;

    border-radius: 30px;

    box-shadow:
        0 15px 40px
        rgba(20,70,45,0.06);

    line-height: 1.9;

    color: #66716b;

    font-size: 17px;

}

.history-box strong {

    color: var(--green-dark);

}


/* =========================================================
   KEGIATAN
========================================================= */

.activities-section {

    padding-top: 60px;

}

.activities {

    max-width: 1100px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 28px;

}


/* =========================================================
   CARD KEGIATAN
========================================================= */

.activity-card {

    position: relative;

    min-height: 480px;

    border-radius: 34px;

    overflow: hidden;

    background: #dfe8e2;

    box-shadow:
        0 15px 40px
        rgba(20,50,35,0.08);

    cursor: pointer;

    transition: 0.4s;

}

.activity-card:hover {

    transform:
        translateY(-7px);

}


/* =========================================================
   GAMBAR
========================================================= */

.activity-image {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition: 0.5s;

}

.activity-card:hover
.activity-image {

    transform:
        scale(1.04);

}


/* =========================================================
   GRADASI GELAP BAGIAN BAWAH
========================================================= */

.activity-card::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to top,
            rgba(10,15,13,0.96) 0%,
            rgba(10,15,13,0.72) 30%,
            rgba(10,15,13,0.12) 67%,
            transparent 100%
        );

    pointer-events: none;

}


/* =========================================================
   ISI CARD
========================================================= */

.activity-content {

    position: absolute;

    left: 38px;

    right: 38px;

    bottom: 35px;

    color: white;

    z-index: 2;

}

.activity-number {

    display: inline-block;

    padding: 10px 18px;

    border:
        1px solid
        rgba(255,255,255,0.45);

    border-radius: 50px;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1.5px;

    margin-bottom: 20px;

    background:
        rgba(255,255,255,0.08);

}

.activity-content h3 {

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(32px,4vw,50px);

    line-height: 1.05;

    margin-bottom: 15px;

}

.activity-content p {

    font-size: 17px;

    line-height: 1.6;

    color:
        rgba(255,255,255,0.88);

}


/* =========================================================
   TOMBOL GANTI FOTO
========================================================= */

.upload-button {

    position: absolute;

    top: 20px;

    right: 20px;

    z-index: 5;

    background:
        rgba(13,66,43,0.92);

    color: white;

    border: none;

    border-radius: 50px;

    padding: 11px 17px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 600;

    opacity: 0;

    transition: 0.3s;

}

.activity-card:hover
.upload-button {

    opacity: 1;

}

.upload-button:hover {

    background: #0b6c41;

}

.file-input {

    display: none;

}


/* =========================================================
   GALERI
========================================================= */

.gallery-box {

    max-width: 1000px;

    margin: auto;

    background: #e3eee6;

    border-radius: 35px;

    padding: 50px 30px;

    text-align: center;

}

.gallery-icon {

    font-size: 60px;

    margin-bottom: 20px;

}

.gallery-box h3 {

    font-family:
        "Playfair Display",
        serif;

    font-size: 35px;

    margin-bottom: 15px;

    color: var(--green-dark);

}

.gallery-box p {

    color: #68766e;

    line-height: 1.7;

    margin-bottom: 25px;

}

.gallery-button {

    display: inline-block;

    padding: 15px 25px;

    background:
        var(--green-dark);

    color: white;

    border-radius: 50px;

    cursor: pointer;

    font-weight: 600;

    transition: 0.3s;

}

.gallery-button:hover {

    transform:
        translateY(-3px);

    background: #0b6c41;

}

.gallery-input {

    display: none;

}

.gallery-preview {

    margin-top: 30px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap: 15px;

}

.gallery-item {

    position: relative;

}

.gallery-item img {

    width: 100%;

    height: 200px;

    object-fit: cover;

    border-radius: 20px;

    display: block;

}

.delete-gallery {

    position: absolute;

    top: 8px;

    right: 8px;

    width: 35px;

    height: 35px;

    border: none;

    border-radius: 50%;

    background:
        var(--green-dark);

    color: white;

    font-size: 22px;

    cursor: pointer;

}


/* =========================================================
   HUBUNGI KAMI
========================================================= */

.contact {

    background:
        var(--green-dark);

    color: white;

    padding: 100px 6%;

}

.contact-inner {

    max-width: 1150px;

    margin: auto;

    display: grid;

    grid-template-columns:
        1.3fr 1fr;

    gap: 70px;

    align-items: center;

}

.contact-label {

    color: #b4d7bf;

    letter-spacing: 3px;

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 20px;

}

.contact h2 {

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(45px,6vw,75px);

    line-height: 1.05;

    margin-bottom: 25px;

}

.contact p {

    font-size: 19px;

    line-height: 1.8;

    color: #d4e3da;

}

.contact-info {

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255
