<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desa Pusaka | Pesona Alam, Budaya & Masyarakat</title>

    <meta name="description"
        content="Website Desa Pusaka yang menampilkan profil desa, sejarah, potensi pertanian, UMKM, budaya, kegiatan masyarakat, dan produk lokal.">

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {
            --green: #123d27;
            --green2: #23734a;
            --green3: #dff0e2;

            --light-green: #eaf7ec;
            --light-green2: #dff1e2;
            --light-green3: #cce8d1;

            --gold: #e5bd61;

            --cream: #f4fbf5;

            --dark: #102119;
            --text: #64736a;

            --white: #ffffff;

            --line: #dce9df;

            --shadow: 0 20px 60px rgba(15, 55, 35, .12);

            --radius: 28px;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "DM Sans", Arial, sans-serif;
            color: var(--dark);
            background: #ffffff;
            line-height: 1.7;
            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        button {
            font: inherit;
        }

        .container {
            width: min(1160px, calc(100% - 40px));
            margin: auto;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            position: fixed;
            z-index: 1000;

            top: 0;
            left: 0;
            right: 0;

            padding: 14px 0;

            transition: .3s ease;
        }

        .navbar.scrolled {
            background: rgba(255, 255, 255, .95);
            backdrop-filter: blur(18px);

            box-shadow: 0 5px 30px rgba(10, 50, 30, .08);
        }

        .nav-inner {
            width: min(1160px, calc(100% - 40px));

            margin: auto;

            min-height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;

            font-family: "Playfair Display", serif;

            font-size: 24px;
            font-weight: 800;

            color: var(--green);

            white-space: nowrap;
        }

        .logo-icon {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: var(--green);

            color: white;

            font-size: 23px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 28px;

            list-style: none;
        }

        .nav-menu a {
            font-weight: 600;
            font-size: 15px;

            color: var(--dark);

            transition: .3s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: var(--green2);
        }

        .nav-contact {
            padding: 12px 20px;

            background: var(--green);

            color: white !important;

            border-radius: 10px;
        }

        .nav-contact:hover {
            background: var(--green2);
        }

        .menu-toggle {
            display: none;

            border: none;
            background: var(--green);
            color: white;

            width: 44px;
            height: 44px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 22px;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 700px;

            display: flex;
            align-items: center;

            position: relative;

            background:
                linear-gradient(
                    90deg,
                    rgba(7, 42, 23, .94) 0%,
                    rgba(7, 42, 23, .78) 42%,
                    rgba(7, 42, 23, .20) 100%
                ),
                url("images/hero-desa.jpg");

            background-size: cover;
            background-position: center;

            color: white;

            padding-top: 100px;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero-label {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 16px;

            background: rgba(35, 115, 74, .75);

            border: 1px solid rgba(255, 255, 255, .20);

            border-radius: 50px;

            font-size: 14px;
            font-weight: 700;

            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: "Playfair Display", serif;

            font-size: clamp(48px, 7vw, 78px);

            line-height: 1.05;

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            max-width: 620px;

            font-size: 18px;

            color: rgba(255, 255, 255, .90);

            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 14px;

            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 14px 22px;

            border-radius: 12px;

            font-weight: 700;

            border: 2px solid transparent;

            transition: .3s ease;

            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--green);

            color: white;
        }

        .btn-primary:hover {
            background: var(--green2);
        }

        .btn-light {
            background: white;

            color: var(--green);
        }

        .btn-light:hover {
            background: var(--light-green);
        }

        .btn-outline-light {
            border-color: white;

            color: white;

            background: transparent;
        }

        .btn-outline-light:hover {
            background: white;

            color: var(--green);
        }

        .hero-tags {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }

        .hero-tag {
            padding: 7px 14px;

            border: 1px solid rgba(255, 255, 255, .30);

            background: rgba(255, 255, 255, .08);

            backdrop-filter: blur(10px);

            border-radius: 50px;

            font-size: 13px;
        }


        /* =====================================================
           SECTION
        ===================================================== */

        section {
            scroll-margin-top: 90px;
        }

        .section-padding {
            padding: 90px 0;
        }

        .section-heading {
            text-align: center;

            max-width: 700px;

            margin: 0 auto 50px;
        }

        .section-label {
            display: inline-block;

            padding: 7px 14px;

            background: var(--light-green);

            color: var(--green2);

            border-radius: 50px;

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 14px;
        }

        .section-heading h2 {
            font-family: "Playfair Display", serif;

            font-size: clamp(34px, 5vw, 48px);

            color: var(--green);

            line-height: 1.2;

            margin-bottom: 15px;
        }

        .section-heading p {
            color: var(--text);

            font-size: 16px;
        }


        /* =====================================================
           PROFIL
        ===================================================== */

        .profil {
            background: white;
        }

        .profil-grid {
            display: grid;

            grid-template-columns: 1fr 1.1fr;

            gap: 60px;

            align-items: center;
        }

        .profil-image {
            position: relative;
        }

        .profil-image img {
            height: 480px;

            border-radius: var(--radius);

            box-shadow: var(--shadow);
        }

        .image-badge {
            position: absolute;

            bottom: 20px;
            right: -20px;

            background: white;

            padding: 18px 22px;

            border-radius: 18px;

            box-shadow: var(--shadow);

            font-weight: 700;

            color: var(--green);
        }

        .profil-content h2 {
            font-family: "Playfair Display", serif;

            font-size: 42px;

            line-height: 1.2;

            color: var(--green);

            margin-bottom: 20px;
        }

        .profil-content p {
            color: var(--text);

            margin-bottom: 18px;
        }

        .check-list {
            list-style: none;

            margin: 25px 0;
        }

        .check-list li {
            margin-bottom: 10px;

            font-weight: 600;

            color: #31523f;
        }

        .check-list li::before {
            content: "✓";

            display: inline-flex;

            width: 24px;
            height: 24px;

            align-items: center;
            justify-content: center;

            margin-right: 9px;

            border-radius: 50%;

            background: var(--light-green);

            color: var(--green2);

            font-weight: 800;
        }


        /* =====================================================
           STATISTIK
        ===================================================== */

        .stats {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 18px;

            margin-top: 50px;
        }

        .stat-card {
            padding: 25px;

            text-align: center;

            background: white;

            border: 1px solid var(--line);

            border-radius: 18px;

            box-shadow: 0 8px 30px rgba(15, 55, 35, .06);
        }

        .stat-card h3 {
            font-size: 30px;

            color: var(--green2);

            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text);

            font-size: 14px;
        }


        /* =====================================================
           SEJARAH
        =================================================
