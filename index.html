<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Desa Pusaka | Profil Desa</title>

    <meta name="description"
          content="Website Desa Pusaka yang menampilkan profil, sejarah, kegiatan, galeri dan informasi desa.">

    <!-- GOOGLE FONT -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 105px;
}

body {
    font-family: "DM Sans", sans-serif;
    background: #f4f8f4;
    color: #103f2b;
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}


/* =========================================================
   WARNA
========================================================= */

:root {
    --green-dark: #0d422b;
    --green: #125034;
    --green-light: #dfece3;
    --cream: #f4f8f4;
    --white: #ffffff;
    --gray: #69736f;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    width: 100%;
    height: 105px;

    background: rgba(255,255,255,0.98);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 38px;

    position: sticky;
    top: 0;

    z-index: 1000;

    box-shadow: 0 3px 20px rgba(0,0,0,0.06);
}


/* =========================================================
   LOGO
========================================================= */

.logo-area {
    display: flex;
    align-items: center;
    gap: 18px;
}

.logo-box {
    width: 74px;
    height: 74px;

    background: var(--green-dark);

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;

    box-shadow: 0 10px 25px rgba(13,66,43,0.15);
}

.logo-text {
    font-family: "Playfair Display", serif;

    font-size: 34px;
    font-weight: 700;

    color: var(--green-dark);
}


/* =========================================================
   MENU DESKTOP
========================================================= */

.desktop-menu {
    display: flex;
    align-items: center;
    gap: 28px;
}

.desktop-menu a {
    color: #284b3b;

    font-size: 15px;
    font-weight: 600;

    transition: 0.3s;
}

.desktop-menu a:hover {
    color: #0b7a45;
}


/* =========================================================
   HAMBURGER
========================================================= */

.menu-button {
    width: 70px;
    height: 70px;

    border: none;
    border-radius: 18px;

    background: var(--green-dark);

    cursor: pointer;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    position: relative;

    z-index: 1001;
}

.menu-button span {
    width: 30px;
    height: 3px;

    background: white;

    border-radius: 10px;

    margin: 4px 0;

    transition: 0.3s;
}


/* HAMBURGER MENJADI X */

.menu-button.active span:nth-child(1) {
    transform: translateY(11px) rotate(45deg);
}

.menu-button.active span:nth-child(2) {
    opacity: 0;
}

.menu-button.active span:nth-child(3) {
    transform: translateY(-11px) rotate(-45deg);
}


/* =========================================================
   MOBILE MENU
========================================================= */

.mobile-menu {
    position: fixed;

    top: 105px;
    right: 0;

    width: 300px;
    height: calc(100vh - 105px);

    background: white;

    padding: 25px;

    transform: translateX(100%);

    transition: transform 0.35s ease;

    z-index: 999;

    box-shadow: -10px 10px 35px rgba(0,0,0,0.15);

    overflow-y: auto;
}

.mobile-menu.active {
    transform: translateX(0);
}

.mobile-menu a {
    display: block;

    padding: 17px 15px;

    border-bottom: 1px solid #e6eee9;

    color: var(--green-dark);

    font-size: 17px;
    font-weight: 600;

    transition: 0.3s;
}

.mobile-menu a:hover {
    background: #eff7f1;

    padding-left: 23px;
}


/* =========================================================
   OVERLAY
========================================================= */

.menu-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.4);

    z-index: 998;

    opacity: 0;
    visibility: hidden;

    transition: 0.3s;
}

.menu-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    min-height: 680px;

    background:
        linear-gradient(
            120deg,
            rgba(8,53,35,0.96),
            rgba(8,53,35,0.55)
        ),
        url("images/desa.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;

    padding: 100px 7%;
}

.hero-content {
    max-width: 780px;

    color: white;
}

.hero-label {
    display: inline-block;

    border: 1px solid rgba(255,255,255,0.45);

    padding: 12px 22px;

    border-radius: 50px;

    font-size: 13px;
    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 25px;
}

.hero h1 {
    font-family: "Playfair Display", serif;

    font-size: clamp(50px, 7vw, 90px);

    line-height: 1.02;

    margin-bottom: 25px;
}

.hero p {
    max-width: 650px;

    font-size: 20px;

    line-height: 1.7;

    color: rgba(255,255,255,0.9);
}

.hero-button {
    display: inline-block;

    margin-top: 35px;

    padding: 17px 30px;

    background: white;

    color: var(--green-dark);

    border-radius: 50px;

    font-weight: 700;

    transition: 0.3s;
}

.hero-button:hover {
    transform: translateY(-4px);

    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}


/* =========================================================
   SECTION
========================================================= */

.section {
    padding: 90px 5%;
}

.section-title {
    text-align: center;

    margin-bottom: 50px;
}

.section-title small {
    display: block;

    color: #6b927c;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: 3px;

    margin-bottom: 12px;
}

.section-title h2 {
    font-family: "Playfair Display", serif;

    font-size: clamp(36px,5vw,55px);

    color: var(--green-dark);
}


/* =========================================================
   CHIPS
========================================================= */

.chips {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-bottom: 55px;
}

.chip {
    padding: 13px 24px;

    border: 1px solid #c9d9cf;

    border-radius: 50px;

    background: rgba(255,255,255,0.6);

    color: #365b49;

    font-size: 16px;
}


/* =========================================================
   STATISTIK
========================================================= */

.stats {
    max-width: 1000px;

    margin: auto;

    background: white;

    border-radius: 32px;

    display: grid;

    grid-template-columns: repeat(4,1fr);

    overflow: hidden;

    box-shadow: 0 20px 50px rgba(20,70,45,0.08);
}

.stat {
    min-height: 190px;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 25px;

    border-right: 1px solid #dbe5df;
}

.stat:last-child {
    border-right: none;
}

.stat-number {
    font-family: "Playfair Display", serif;

    font-size: 43px;

    font-weight: 700;

    color: var(--green-dark);

    margin-bottom: 10px;
}

.stat-label {
    font-size: 16px;

    color: #727c77;
}


/* =========================================================
   SEJARAH
========================================================= */

.history-box {
    max-width: 900px;

    margin: auto;

    background: white;

    padding: 40px;

    border-radius: 30px;

    box-shadow: 0 15px 40px rgba(20,70,45,0.06);

    color: #66716b;

    font-size: 17px;

    line-height: 1.9;
}

.history-box strong {
    color: var(--green-dark);
}


/* =========================================================
   KEGIATAN
========================================================= */

.activities-section {
    padding-top: 60px;
}

.activities {
    max-width: 1100px;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(2,1fr);

    gap: 28px;
}


/* =========================================================
   CARD
========================================================= */

.activity-card {
    position: relative;

    min-height: 480px;

    border-radius: 34px;

    overflow: hidden;

    background: #dfe8e2;

    box-shadow: 0 15px 40px rgba(20,50,35,0.08);

    transition: 0.4s;
}

.activity-card:hover {
    transform: translateY(-7px);
}


/* =========================================================
   GAMBAR CARD
========================================================= */

.activity-image {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: 0.5s;
}

.activity-card:hover .activity-image {
    transform: scale(1.05);
}


/* =========================================================
   GRADASI GELAP
========================================================= */

.activity-card::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to top,
            rgba(10,15,13,0.97) 0%,
            rgba(10,15,13,0.75) 32%,
            rgba(10,15,13,0.15) 68%,
            transparent 100%
        );

    pointer-events: none;
}


/* =========================================================
   ISI CARD
========================================================= */

.activity-content {
    position: absolute;

    left: 38px;
    right: 38px;
    bottom: 35px;

    z-index: 2;

    color: white;
}

.activity-number {
    display: inline-block;

    padding: 10px 18px;

    border: 1px solid rgba(255,255,255,0.45);

    border-radius: 50px;

    background: rgba(255,255,255,0.08);

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 1.5px;

    margin-bottom: 20px;
}

.activity-content h3 {
    font-family: "Playfair Display", serif;

    font-size: clamp(32px,4vw,50px);

    line-height: 1.05;

    margin-bottom: 15px;
}

.activity-content p {
    font-size: 17px;

    line-height: 1.6;

    color: rgba(255,255,255,0.9);
}


/* =========================================================
   GALERI
========================================================= */

.gallery-box {
    max-width: 1000px;

    margin: auto;

    padding: 55px 30px;

    background: #e3eee6;

    border-radius: 35px;

    text-align: center;
}

.gallery-icon {
    font-size: 60px;

    margin-bottom: 20px;
}

.gallery-box h3 {
    font-family: "Playfair Display", serif;

    font-size: 35px;

    color: var(--green-dark);

    margin-bottom: 15px;
}

.gallery-box p {
    max-width: 650px;

    margin: 0 auto 25px;

    color: #68766e;

    line-height: 1.7;
}

.gallery-button {
    display: inline-block;

    padding: 15px 25px;

    background: var(--green-dark);

    color: white;

    border-radius: 50px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.3s;
}

.gallery-button:hover {
    transform: translateY(-3px);

    background: #0b6c41;
}

.gallery-input {
    display: none;
}

.gallery-preview {
    margin-top: 30px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap: 15px;
}

.gallery-item {
    position: relative;
}

.gallery-item img {
    width: 100%;
    height: 200px;

    object-fit: cover;

    border-radius: 20px;

    display: block;
}

.delete-gallery {
    position: absolute;

    top: 8px;
    right: 8px;

    width: 35px;
    height: 35px;

    border: none;

    border-radius: 50%;

    background: var(--green-dark);

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* =========================================================
   HUBUNGI KAMI
========================================================= */

.contact {
    background: var(--green-dark);

    color: white;

    padding: 100px 6%;
}

.contact-inner {
    max-width: 1150px;

    margin: auto;

    display: grid;

    grid-template-columns: 1.3fr 1fr;

    gap: 70px;

    align-items: center;
}

.contact-label {
    color: #b4d7bf;

    letter-spacing: 3px;

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 20px;
}

.contact h2 {
    font-family: "Playfair Display", serif;

    font-size: clamp(45px,6vw,75px);

    line-height: 1.05;

    margin-bottom: 25px;
}

.contact p {
    font-size: 19px;

    line-height: 1.8;

    color: #d4e3da;
}

.contact-info {
    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 28px;

    padding: 30px;
}


/* =========================================================
   CONTACT ITEM
========================================================= */

.contact-item {
    padding: 18px 0;

    border-bottom: 1px solid rgba(255,255,255,0.15);

    display: flex;

    gap: 15px;

    align-items: flex-start;
}

.contact-item:last-child {
    border-bottom: none;
}

.contact-icon {
    width: 45px;
    height: 45px;

    flex-shrink: 0;

    background: white;

    color: var(--green-dark);

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.contact-text {
    flex: 1;
}

.contact-text strong {
    display: block;

    margin-bottom: 5px;

    color: white;
}

.contact-text span,
.contact-text a {
    color: #c7d9ce;

    line-height: 1.6;

    font-size: 15px;
}


/* =========================================================
   ALAMAT KLIK
========================================================= */

.location-link {
    display: inline-block;

    color: #c7d9ce !important;

    transition: 0.3s;
}

.location-link:hover {
    color: white !important;

    text-decoration: underline;
}


/* =========================================================
   FACEBOOK
========================================================= */

.facebook-link {
    color: #c7d9ce !important;

    transition: 0.3s;
}

.facebook-link:hover {
    color: white !important;

    text-decoration: underline;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    background: #082f20;

    color: #bfd2c6;

    text-align: center;

    padding: 30px 20px;

    font-size: 14px;
}

.footer-title {
    font-family: "Playfair Display", serif;

    color: white;

    font-size: 24px;

    margin-bottom: 8px;
}


/* =========================================================
   BACK TO TOP
========================================================= */

.back-top {
    position: fixed;

    right: 25px;
    bottom: 25px;

    width: 60px;
    height: 60px;

    border: none;

    border-radius: 18px;

    background: var(--green-dark);

    color: white;

    font-size: 26px;

    cursor: pointer;

    z-index: 500;

    opacity: 0;
    visibility: hidden;

    transform: translateY(20px);

    transition: 0.3s;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.back-top.show {
    opacity: 1;

    visibility: visible;

    transform: translateY(0);
}

.back-top:hover {
    transform: translateY(-4px);
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .desktop-menu {
        display: none;
    }

    .menu-button {
        display: flex;
    }

    .activities {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .stat:nth-child(2) {
        border-right: none;
    }

    .stat:nth-child(1),
    .stat:nth-child(2) {
        border-bottom: 1px solid #dbe5df;
    }

    .contact-inner {
        grid-template-columns: 1fr;
    }
}


/* =========================================================
   HP
========================================================= */

@media (max-width: 600px) {

    .header {
        height: 105px;

        padding: 0 18px;
    }

    .logo-area {
        gap: 12px;
    }

    .logo-box {
        width: 68px;
        height: 68px;

        border-radius: 18px;

        font-size: 37px;
    }

    .logo-text {
        font-size: 26px;
    }

    .menu-button {
        width: 68px;
        height: 68px;

        border-radius: 18px;
    }

    .mobile-menu {
        top: 105px;

        width: 285px;

        height: calc(100vh - 105px);
    }

    .hero {
        min-height: 600px;

        padding: 80px 25px;
    }

    .hero h1 {
        font-size: 52px;
    }

    .hero p {
        font-size: 17px;
    }

    .section {
        padding: 65px 25px;
    }

    .section-title {
        margin-bottom: 35px;
    }

    .stats {
        border-radius: 28px;
    }

    .stat {
        min-height: 160px;

        padding: 15px;
    }

    .stat-number {
        font-size: 36px;
    }

    .stat-label {
        font-size: 14px;
    }

    .history-box {
        padding: 28px 22px;

        font-size: 16px;
    }

    .activity-card {
        min-height: 460px;

        border-radius: 30px;
    }

    .activity-content {
        left: 25px;
        right: 25px;
        bottom: 30px;
    }

    .activity-content h3 {
        font-size: 37px;
    }

    .activity-content p {
        font-size: 16px;
    }

    .contact {
        padding: 75px 25px;
    }

    .contact h2 {
        font-size: 48px;
    }

    .contact p {
        font-size: 17px;
    }

    .gallery-box {
        padding: 40px 20px;
    }

    .gallery-box h3 {
        font-size: 30px;
    }

    .back-top {
        right: 20px;
        bottom: 20px;
    }
}


/* =========================================================
   HP SANGAT KECIL
========================================================= */

@media (max-width: 380px) {

    .header {
        padding: 0 14px;
    }

    .logo-text {
        font-size: 22px;
    }

    .logo-box {
        width: 62px;
        height: 62px;
    }

    .menu-button {
        width: 62px;
        height: 62px;
    }

    .activity-content h3 {
        font-size: 32px;
    }
}

</style>
</head>
