<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Desa Pusaka | Pesona Alam, Budaya & Masyarakat
</title>

<meta name="description"
content="Website resmi Desa Pusaka yang memperkenalkan sejarah, potensi alam, budaya, dua dusun, kegiatan, dan kehidupan masyarakat Desa Pusaka.">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
rel="stylesheet">


<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --green-dark: #0b2f1d;

    --green: #123d27;

    --green-light: #28784f;

    --green-soft: #e7f3e9;

    --cream: #f7faf5;

    --cream-dark: #eef5ed;

    --gold: #d9b65d;

    --gold-light: #f0d98c;

    --dark: #14231b;

    --text: #68766d;

    --white: #ffffff;

    --line: #dce8de;

    --shadow-sm:
        0 10px 30px rgba(12, 52, 31, .08);

    --shadow:
        0 25px 70px rgba(12, 52, 31, .13);

    --radius: 28px;

    --transition: .35s ease;
}


/* =========================================================
   RESET
========================================================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    font-family:
        "DM Sans",
        Arial,
        sans-serif;

    color: var(--dark);

    background: #fff;

    line-height: 1.7;

    overflow-x: hidden;

}


body.menu-open {

    overflow: hidden;

}


a {

    text-decoration: none;

    color: inherit;

}


button {

    font-family: inherit;

}


img {

    width: 100%;

    display: block;

}


.container {

    width:
        min(
            1160px,
            calc(100% - 40px)
        );

    margin: auto;

}


section {

    scroll-margin-top: 90px;

}


/* =========================================================
   SCROLL PROGRESS
========================================================= */

.scroll-progress {

    position: fixed;

    top: 0;

    left: 0;

    width: 0;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            var(--gold),
            var(--green-light)
        );

    z-index: 9999;

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    position: fixed;

    top: 0;

    left: 0;

    right: 0;

    z-index: 1000;

    padding: 15px 0;

    transition: var(--transition);

}


.navbar.scrolled {

    padding: 9px 0;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 8px 35px
        rgba(10,50,30,.08);

}


.nav-inner {

    min-height: 62px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

}


.logo {

    display: flex;

    align-items: center;

    gap: 11px;

    color: #fff;

    font-family:
        "Playfair Display",
        serif;

    font-size: 23px;

    font-weight: 800;

    white-space: nowrap;

}


.navbar.scrolled .logo {

    color: var(--green);

}


.logo-icon {

    width: 44px;

    height: 44px;

    display: grid;

    place-items: center;

    border-radius: 14px;

    background:
        rgba(255,255,255,.15);

    border:
        1px solid
        rgba(255,255,255,.25);

    font-size: 21px;

    transition:
        var(--transition);

}


.navbar.scrolled .logo-icon {

    background:
        var(--green);

    border-color:
        var(--green);

}


.nav-menu {

    display: flex;

    align-items: center;

    gap: 4px;

    list-style: none;

}


.nav-menu a {

    position: relative;

    display: block;

    padding: 10px 12px;

    border-radius: 10px;

    color: #fff;

    font-size: 13px;

    font-weight: 700;

    transition:
        var(--transition);

}


.navbar.scrolled
.nav-menu a {

    color: #47564d;

}


.nav-menu a:hover,
.nav-menu a.active {

    background:
        rgba(255,255,255,.14);

    color: #fff;

}


.navbar.scrolled
.nav-menu a:hover,

.navbar.scrolled
.nav-menu a.active {

    background:
        var(--green-soft);

    color: var(--green);

}


.nav-contact {

    background:
        #fff !important;

    color:
        var(--green) !important;

    padding-left:
        17px !important;

    padding-right:
        17px !important;

}


.navbar.scrolled
.nav-contact {

    background:
        var(--green) !important;

    color:
        #fff !important;

}


.menu-toggle {

    display: none;

    width: 44px;

    height: 44px;

    border: 0;

    border-radius: 13px;

    background:
        var(--green);

    color: #fff;

    cursor: pointer;

    font-size: 21px;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    min-height: 100vh;

    display: flex;

    align-items: center;

    position: relative;

    color: #fff;

    padding-top: 100px;

    background:

        linear-gradient(

            90deg,

            rgba(5,34,19,.96) 0%,

            rgba(5,34,19,.82) 40%,

            rgba(5,34,19,.30) 75%,

            rgba(5,34,19,.15) 100%

        ),

        url("images/hero-desa.jpg")

        center/cover no-repeat;

}


.hero::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(

            circle at 80% 30%,

            rgba(217,182,93,.15),

            transparent 28%

        );

}


.hero::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 150px;

    background:

        linear-gradient(

            to bottom,

            transparent,

            rgba(255,255,255,.08)

        );

}


.hero-content {

    position: relative;

    z-index: 2;

    max-width: 760px;

    padding: 80px 0;

    animation:
        heroUp 1s ease both;

}


@keyframes heroUp {

    from {

        opacity: 0;

        transform:
            translateY(35px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


.hero-label {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 9px 15px;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        rgba(255,255,255,.09);

    backdrop-filter:
        blur(12px);

    border-radius: 50px;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: .05em;

    margin-bottom: 22px;

}


.hero h1 {

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(
            48px,
            7vw,
            84px
        );

    line-height: .98;

    letter-spacing: -.045em;

    margin-bottom: 27px;

}


.hero h1 span {

    color:
        var(--gold-light);

}


.hero p {

    max-width: 650px;

    color:
        rgba(255,255,255,.86);

    font-size: 17px;

    line-height: 1.8;

    margin-bottom: 31px;

}


.hero-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 12px;

    margin-bottom: 27px;

}


.btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    min-height: 50px;

    padding: 12px 21px;

    border-radius: 14px;

    border:
        2px solid
        transparent;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;

    transition:
        var(--transition);

}


.btn:hover {

    transform:
        translateY(-4px);

}


.btn-primary {

    background:
        var(--green);

    color: #fff;

    box-shadow:
        0 10px 30px
        rgba(18,61,39,.2);

}


.btn-primary:hover {

    background:
        var(--green-light);

}


.btn-light {

    background:
        #fff;

    color:
        var(--green);

}


.btn-light:hover {

    background:
        var(--green-soft);

}


.btn-outline-light {

    background:
        rgba(255,255,255,.04);

    border-color:
        rgba(255,255,255,.42);

    color: #fff;

    backdrop-filter:
        blur(8px);

}


.btn-outline-light:hover {

    background:
        #fff;

    color:
        var(--green);

}


.hero-tags {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

}


.hero-tag {

    padding: 7px 13px;

    border:
        1px solid
        rgba(255,255,255,.16);

    background:
        rgba(0,0,0,.16);

    backdrop-filter:
        blur(8px);

    border-radius: 50px;

    font-size: 12px;

}


/* =========================================================
   SCROLL INDICATOR
========================================================= */

.scroll-indicator {

    position: absolute;

    right: 45px;

    bottom: 45px;

    z-index: 5;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 9px;

    color:
        rgba(255,255,255,.65);

    font-size: 10px;

    letter-spacing: .15em;

    text-transform: uppercase;

}


.scroll-line {

    width: 1px;

    height: 48px;

    background:
        rgba(255,255,255,.5);

    position: relative;

    overflow: hidden;

}


.scroll-line::after {

    content: "";

    position: absolute;

    top: -20px;

    left: 0;

    width: 100%;

    height: 20px;

    background:
        #fff;

    animation:
        scrollLine 1.8s infinite;

}


@keyframes scrollLine {

    0% {

        transform:
            translateY(0);

    }

    100% {

        transform:
            translateY(70px);

    }

}


/* =========================================================
   SECTION
========================================================= */

.section {

    padding:
        105px 0;

}


.section-soft {

    background:
        var(--cream);

}


.section-heading {

    max-width: 750px;

    margin:
        0 auto 55px;

    text-align: center;

}


.section-heading.left {

    text-align: left;

    margin-left: 0;

}


.section-label {

    display: inline-block;

    color:
        var(--green-light);

    font-size: 12px;

    font-weight: 900;

    letter-spacing: .15em;

    text-transform: uppercase;

}


.section-heading h2,
.about-text h2 {

    margin:
        8px 0 16px;

    color:
        var(--green);

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(
            36px,
            5vw,
            57px
        );

    line-height: 1.08;

    letter-spacing: -.025em;

}


.section-heading p,
.about-text p {

    color:
        var(--text);

    font-size: 16px;

}


/* =========================================================
   STATS
========================================================= */

.stats {

    position: relative;

    z-index: 5;

    margin-top: -45px;

}


.stats-box {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    background:
        #fff;

    border-radius: 25px;

    box-shadow:
        var(--shadow);

    border:
        1px solid
        var(--line);

    overflow: hidden;

}


.stat {

    padding:
        28px 25px;

    text-align: center;

    border-right:
        1px solid
        var(--line);

}


.stat:last-child {

    border-right: none;

}


.stat-number {

    color:
        var(--green);

    font-family:
        "Playfair Display",
        serif;

    font-size: 34px;

    font-weight: 800;

}


.stat-label {

    color:
        var(--text);

    font-size: 13px;

    margin-top: 2px;

}


/* =========================================================
   TENTANG
========================================================= */

.intro-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 65px;

    align-items: center;

}


.about-image {

    min-height: 510px;

    border-radius: 32px;

    overflow: hidden;

    background:
        #e4eee6;

    box-shadow:
        var(--shadow);

    position: relative;

}


.about-image::after {

    content: "";

    position: absolute;

    inset: 0;

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius: inherit;

    pointer-events: none;

}


.about-image img {

    height: 100%;

    min-height: 510px;

    object-fit: cover;

    transition:
        transform .8s ease;

}


.about-image:hover img {

    transform:
        scale(1.05);

}


.image-badge {

    position: absolute;

    right: 24px;

    bottom: 24px;

    z-index: 2;

    background:
        rgba(255,255,255,.94);

    color:
        var(--green);

    padding:
        16px 22px;

    border-radius: 18px;

    font-size: 14px;

    font-weight: 800;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.12);

}


.about-text p {

    margin-bottom: 18px;

}


.check-list {

    display: grid;

    gap: 11px;

    margin: 26px 0;

}


.check-list div {

    display: flex;

    gap: 11px;

    align-items: center;

    font-weight: 700;

    font-size: 14px;

}


.check-list span {

    width: 29px;

    height: 29px;

    flex: none;

    display: grid;

    place-items: center;

    border-radius: 50%;

    background:
        var(--green-soft);

    color:
        var(--green);

    font-weight: 900;

}


/* =========================================================
   DUSUN
========================================================= */

.dusun-section {

    padding:
        105px 0;

    background:
        var(--cream);

}


.dusun-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 24px;

}


.dusun-card {

    position: relative;

    padding: 38px;

    background:
        #fff;

    border:
        1px solid
        var(--line);

    border-radius: 28px;

    box-shadow:
        var(--shadow-sm);

    overflow: hidden;

    transition:
        var(--transition);

}


.dusun-card::before {

    content: "";

    position: absolute;

    width: 180px;

    height: 180px;

    right: -70px;

    top: -70px;

    border-radius: 50%;

    background:
        var(--green-soft);

}


.dusun-card:hover {

    transform:
        translateY(-8px);

    box-shadow:
        var(--shadow);

    border-color:
        #c9ddcf;

}


.dusun-number {

    position: relative;

    z-index: 2;

    color:
        var(--gold);

    font-size: 12px;

    font-weight: 900;

    letter-spacing: .15em;

    text-transform: uppercase;

    margin-bottom: 12px;

}


.dusun-icon {

    position: relative;

    z-index: 2;

    width: 65px;

    height: 65px;

    display: grid;

    place-items: center;

    background:
        var(--green-soft);

    border-radius: 19px;

    font-size: 30px;

    margin-bottom: 20px;

}


.dusun-card h3 {

    position: relative;

    z-index: 2;

    color:
        var(--green);

    font-family:
        "Playfair Display",
        serif;

    font-size: 32px;

    margin-bottom: 10px;

}


.dusun-card p {

    position: relative;

    z-index: 2;

    color:
        var(--text);

    font-size: 15px;

    line-height: 1.8;

}


.dusun-badge {

    position: relative;

    z-index: 2;

    display: inline-block;

    margin-top: 20px;

    padding: 7px 13px;

    border-radius: 50px;

    background:
        var(--green-soft);

    color:
        var(--green);

    font-size: 12px;

    font-weight: 800;

}


/* =========================================================
   CARDS
========================================================= */

.cards {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 22px;

}


.card {

    padding: 32px;

    background:
        #fff;

    border:
        1px solid
        var(--line);

    border-radius: 25px;

    box-shadow:
        var(--shadow-sm);

    transition:
        var(--transition);

    position: relative;

    overflow: hidden;

}


.card::before {

    content: "";

    position: absolute;

    width: 120px;

    height: 120px;

    right: -50px;

    top: -50px;

    border-radius: 50%;

    background:
        var(--green-soft);

    opacity: .7;

}
