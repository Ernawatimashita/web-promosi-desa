<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Desa Pusaka | Dusun Puting & Dusun Beliung</title>

<meta name="description" content="Profil Desa Pusaka yang terdiri dari Dusun Puting dan Dusun Beliung.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --green:#123d27;
    --green2:#23734a;
    --cream:#f7f8f2;
    --gold:#e5bd61;
    --dark:#102119;
    --text:#64736a;
    --white:#fff;
    --line:#e4ebe5;
    --shadow:0 20px 60px rgba(15,55,35,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",Arial,sans-serif;
    color:var(--dark);
    line-height:1.7;
    background:#fff;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    width:100%;
    display:block;
    object-fit:cover;
}

.container{
    width:min(1160px,calc(100% - 40px));
    margin:auto;
}


/* ================= NAVBAR ================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(15px);
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.nav-inner{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    color:var(--green);
}

.logo-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:var(--green);
    color:#fff;
    font-size:1.2rem;
}

.nav-links{
    display:flex;
    gap:5px;
    align-items:center;
}

.nav-links a{
    padding:10px 13px;
    border-radius:11px;
    color:#47564d;
    font-weight:600;
    transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
    background:#e9f4eb;
    color:var(--green);
}

.nav-contact{
    background:var(--green);
    color:#fff!important;
}

.nav-contact:hover{
    background:var(--green2)!important;
    color:#fff!important;
}


/* ================= HERO ================= */

.page-hero{
    min-height:500px;
    padding-top:72px;

    display:flex;
    align-items:center;

    color:#fff;

    background:
        linear-gradient(
            90deg,
            rgba(7,35,20,.92),
            rgba(7,35,20,.45)
        ),
        url("assets/img/desa.jpg") center/cover no-repeat;
}

.page-hero-content{
    max-width:800px;
}

.page-label{
    display:inline-block;
    margin-bottom:10px;

    color:#dceebf;

    font-size:.78rem;
    font-weight:900;

    letter-spacing:.15em;
    text-transform:uppercase;
}

.page-hero h1{
    font-family:"Playfair Display",Georgia,serif;

    font-size:clamp(3rem,7vw,5.5rem);

    line-height:1;

    margin-bottom:20px;
}

.page-hero h1 span{
    color:var(--gold);
}

.page-hero p{
    max-width:650px;

    color:#e6eee8;

    font-size:1.05rem;
}


/* ================= SECTION ================= */

section{
    padding:90px 0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:55px;

    align-items:center;
}

.photo{
    height:450px;

    overflow:hidden;

    border-radius:28px;

    box-shadow:
        0 20px 50px rgba(15,55,35,.15);
}

.photo img{
    height:100%;

    transition:.5s;
}

.photo:hover img{
    transform:scale(1.05);
}

.label{
    color:var(--green2);

    font-size:.78rem;

    font-weight:900;

    letter-spacing:.15em;

    text-transform:uppercase;
}

h2{
    font-family:"Playfair Display",Georgia,serif;

    font-size:clamp(2.2rem,4vw,3.5rem);

    line-height:1.1;

    margin:8px 0 18px;
}

p{
    color:var(--text);

    margin-bottom:15px;
}


/* ================= DUSUN ================= */

.soft{
    background:var(--cream);
}

.section-title{
    max-width:750px;

    margin:auto;

    text-align:center;
}

.section-title h2{
    margin-top:8px;
}

.section-title p{
    margin-top:10px;
}

.dusun-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:25px;

    margin-top:45px;
}

.dusun{
    position:relative;

    overflow:hidden;

    background:#fff;

    padding:35px;

    border:1px solid var(--line);

    border-radius:25px;

    box-shadow:
        0 10px 30px rgba(20,70,40,.06);

    transition:.3s;
}

.dusun:hover{
    transform:translateY(-7px);

    box-shadow:
        0 20px 40px rgba(20,70,40,.12);
}

.dusun::after{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    right:-40px;
    top:-40px;

    border-radius:50%;

    background:#e9f4eb;

    opacity:.7;
}

.dusun-icon{
    position:relative;

    z-index:2;

    width:55px;
    height:55px;

    display:grid;
    place-items:center;

    background:#e4f1e5;

    border-radius:16px;

    font-size:1.5rem;

    margin-bottom:18px;
}

.dusun h3{
    position:relative;

    z-index:2;

    font-family:"Playfair Display",Georgia,serif;

    font-size:1.7rem;

    margin-bottom:10px;

    color:var(--green);
}

.dusun p{
    position:relative;

    z-index:2;
}

.dusun-info{
    position:relative;

    z-index:2;

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:20px;
}

.dusun-info span{
    padding:7px 11px;

    border-radius:100px;

    background:#edf6ee;

    color:var(--green2);

    font-size:.8rem;

    font-weight:700;
}


/* ================= VISI MISI ================= */

.visi{
    background:var(--green);

    color:#fff;

    padding:50px;

    border-radius:30px;

    box-shadow:var(--shadow);
}

.visi .label{
    color:#dceebf;
}

.visi h2{
    color:#fff;
}

.visi p{
    color:#d8e6dc;
}

.misi{
    display:grid;

    gap:12px;

    margin-top:20px;
}

.misi div{
    padding:14px 17px;

    border-radius:12px;

    background:rgba(255,255,255,.08);

    color:#eef7f0;
}


/* ================= POTENSI ================= */

.potensi-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:22px;

    margin-top:45px;
}

.potensi-card{
    background:#fff;

    border:1px solid var(--line);

    border-radius:22px;

    padding:28px;

    transition:.3s;
}

.potensi-card:hover{
    transform:translateY(-6px);

    box-shadow:
        0 18px 40px rgba(20,70,40,.10);
}

.potensi-icon{
    width:50px;
    height:50px;

    display:grid;
    place-items:center;

    background:#e5f2e6;

    border-radius:14px;

    font-size:1.35rem;

    margin-bottom:15px;
}

.potensi-card h3{
    color:var(--green);

    margin-bottom:8px;
}

.potensi-card p{
    font-size:.93rem;
}


/* ================= GALERI ================= */

.gallery{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:25px;

    margin-top:45px;
}

.gallery-photo{
    height:330px;

    overflow:hidden;

    border-radius:25px;

    box-shadow:
        0 15px 40px rgba(15,55,35,.12);
}

.gallery-photo img{
    height:100%;

    transition:.5s;
}

.gallery-photo:hover img{
    transform:scale(1.06);
}


/* ================= FOOTER ================= */

footer{
    background:#0d2819;

    color:#bfcfc3;

    padding:55px 0 20px;
}

.footer-grid{
    display:grid;

    grid-template-columns:1.5fr 1fr 1fr;

    gap:30px;
}

.footer-title{
    color:#fff;

    font-weight:800;

    margin-bottom:10px;

    font-size:1.1rem;
}

.footer-text{
    color:#aebfb3;
}

.footer-links{
    display:grid;

    gap:7px;
}

.footer-links a{
    transition:.2s;
}

.footer-links a:hover{
    color:#fff;

    transform:translateX(3px);
}

.socials{
    display:flex;

    gap:8px;

    margin-top:16px;
}

.social{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border:1px solid rgba(255,255,255,.13);

    border-radius:12px;

    transition:.25s;
}

.social:hover{
    background:rgba(255,255,255,.08);
}

.copy{
    border-top:1px solid rgba(255,255,255,.1);

    margin-top:35px;

    padding-top:18px;

    text-align:center;

    font-size:.88rem;

    color:#8fa497;
}


/* ================= MOBILE ================= */

@media(max-width:900px){

    .nav-inner{
        min-height:70px;
    }

    .nav-links{
        gap:2px;

        overflow-x:auto;

        max-width:70%;
    }

    .nav-links a{
        white-space:nowrap;

        font-size:.85rem;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .dusun-grid{
        grid-template-columns:1fr;
    }

    .potensi-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}


@media(max-width:600px){

    .container{
        width:calc(100% - 30px);
    }

    .nav-inner{
        flex-wrap:wrap;

        padding:10px 0;
    }

    .logo{
        font-size:.95rem;
    }

    .logo-icon{
        width:38px;
        height:38px;
    }

    .nav
